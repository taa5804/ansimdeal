<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12394d">
<title>조회 현황 | 우리아파트 분양</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f7f9;
  overflow-x:hidden;
}

#viewStatusApp{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:clamp(10px,2.5vw,18px);
  background:#f5f7f9;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;
}

#viewStatusApp *{
  box-sizing:border-box;
}

#viewStatusApp .head{
  margin-bottom:16px;
}

#viewStatusApp .head h2{
  margin:0 0 5px;
  font-size:clamp(21px,3vw,24px);
}

#viewStatusApp .head p{
  margin:0;
  color:#71808d;
  font-size:13px;
  line-height:1.5;
  word-break:keep-all;
}

#viewStatusApp .summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}

#viewStatusApp .summary-box{
  min-width:0;
  padding:15px;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#viewStatusApp .summary-box span{
  display:block;
  margin-bottom:7px;
  color:#71808d;
  font-size:12px;
}

#viewStatusApp .summary-box strong{
  display:block;
  font-size:clamp(18px,2.5vw,21px);
  overflow-wrap:anywhere;
}

#viewStatusApp .panel{
  overflow:hidden;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:#fff;
}

#viewStatusApp .panel-title{
  padding:14px 15px;
  border-bottom:1px solid #e4e9ed;
  font-size:16px;
  font-weight:800;
}

#viewStatusApp .filters{
  display:grid;
  grid-template-columns:1fr 1fr 1.3fr 1.5fr auto;
  gap:7px;
  padding:12px;
}

#viewStatusApp input,
#viewStatusApp select,
#viewStatusApp button{
  width:100%;
  min-width:0;
  height:40px;
  padding:0 9px;
  border:1px solid #cad4dc;
  border-radius:6px;
  background:#fff;
  font-size:12px;
}

#viewStatusApp button{
  padding:0 15px;
  border:0;
  background:#12394d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

#viewStatusApp .table-tools{
  padding:10px 12px;
  border-top:1px solid #e5eaee;
}

#viewStatusApp .table-wrap{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

#viewStatusApp table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
}

#viewStatusApp th{
  padding:11px 7px;
  border-bottom:1px solid #dfe5ea;
  background:#f6f8fa;
  color:#536575;
  font-size:12px;
  white-space:nowrap;
}

#viewStatusApp td{
  padding:12px 7px;
  border-bottom:1px solid #edf0f2;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
}

#viewStatusApp .valid{
  color:#17804b;
  font-weight:800;
}

#viewStatusApp .waiting{
  color:#b27a20;
  font-weight:800;
}

#viewStatusApp #empty{
  padding:55px 10px;
  color:#8b98a3;
  text-align:center;
  font-size:13px;
}

@media(max-width:900px){
  #viewStatusApp .summary{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #viewStatusApp .filters{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #viewStatusApp .filters #rg,
  #viewStatusApp .filters #kw{
    grid-column:auto;
  }

  #viewStatusApp .filters #searchBtn{
    grid-column:1 / -1;
  }
}

@media(max-width:560px){
  #viewStatusApp{
    padding:10px;
  }

  #viewStatusApp .summary{
    gap:8px;
  }

  #viewStatusApp .summary-box{
    padding:12px;
  }

  #viewStatusApp .filters{
    grid-template-columns:1fr;
  }

  #viewStatusApp .filters #searchBtn{
    grid-column:auto;
  }

  #viewStatusApp input,
  #viewStatusApp select,
  #viewStatusApp button{
    height:44px;
    font-size:13px;
  }

  #viewStatusApp .panel-title{
    font-size:15px;
  }
}

@media(max-width:360px){
  #viewStatusApp .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="viewStatusApp">

  <div class="head">
    <h2>조회 현황</h2>
    <p>분양 카탈로그 조회 및 유효조회 현황을 확인합니다.</p>
  </div>

  <div class="summary">

    <div class="summary-box">
      <span>전체 조회</span>
      <strong id="v1">0건</strong>
    </div>

    <div class="summary-box">
      <span>유효조회</span>
      <strong id="v2">0건</strong>
    </div>

    <div class="summary-box">
      <span>포인트 지급</span>
      <strong id="v3">0 P</strong>
    </div>

    <div class="summary-box">
      <span>충전금 차감</span>
      <strong id="v4">0원</strong>
    </div>

  </div>

  <div class="panel">

    <div class="panel-title">
      분양 카탈로그 조회내역
    </div>

    <div class="filters">

      <input type="date" id="sd">
      <input type="date" id="ed">

      <select id="rg">
        <option value="">전체 지역</option>
        <option>서울특별시</option>
        <option>경기도</option>
        <option>인천광역시</option>
        <option>부산광역시</option>
        <option>대구광역시</option>
        <option>대전광역시</option>
        <option>울산광역시</option>
        <option>세종특별자치시</option>
        <option>강원특별자치도</option>
        <option>충청북도</option>
        <option>충청남도</option>
        <option>전북특별자치도</option>
        <option>전남광주통합특별시</option>
        <option>경상북도</option>
        <option>경상남도</option>
        <option>제주특별자치도</option>
      </select>

      <input
        type="text"
        id="kw"
        placeholder="분양사·아파트명·유입동네 검색"
      >

      <button type="button" id="searchBtn">
        새로고침 · 조회
      </button>

    </div>

    <div class="table-tools">
      총 <strong id="cnt">0</strong>건 (60초 유효열람 및 방문예약 실시간 연동 · 고객 연락처 안심 마스킹 적용)
    </div>

    <div class="table-wrap">

      <table>
        <thead>
          <tr>
            <th>조회일시</th>
            <th>지역 / 유입동네</th>
            <th>분양사</th>
            <th>아파트</th>
            <th>확인 페이지</th>
            <th>조회시간 / 구분</th>
            <th>유효조회</th>
            <th>지급 혜택</th>
            <th>충전금 차감</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>

      <div id="empty">
        조회된 분양 카탈로그 내역이 없습니다.
      </div>

    </div>

  </div>

</div>

<script>
(function(){
"use strict";

var root=document.getElementById("viewStatusApp");
if(!root)return;

var SIDO_MAP = {
  seoul: "서울특별시",
  gyeonggi: "경기도",
  incheon: "인천광역시",
  busan: "부산광역시",
  daegu: "대구광역시",
  daejeon: "대전광역시",
  ulsan: "울산광역시",
  sejong: "세종특별자치시",
  gangwon: "강원특별자치도",
  chungbuk: "충청북도",
  chungnam: "충청남도",
  jeonbuk: "전북특별자치도",
  jg: "전남광주통합특별시",
  gyeongbuk: "경상북도",
  gyeongnam: "경상남도",
  jeju: "제주특별자치도"
};

var D=[];

function el(id){
  return root.querySelector("#"+id);
}

function n(v){
  return Number(v||0).toLocaleString("ko-KR");
}

function fmtDate(iso){
  if(!iso) return "-";
  var s = String(iso).replace("T", " ").slice(0, 16);
  return s;
}

function show(A){

  var total=A.length;
  var valid=0;
  var point=0;
  var charge=0;

  el("rows").innerHTML="";
  el("cnt").textContent=total;

  el("empty").style.display=
    total ? "none" : "block";

  A.forEach(function(x){

    if(x.valid){
      valid++;
    }

    point+=Number(x.point||0);
    charge+=Number(x.charge||0);

    var tr=document.createElement("tr");

    tr.innerHTML=
      "<td>"+(x.date||"-")+"</td>"+
      "<td>"+(x.regionLabel||x.region||"-")+"</td>"+
      "<td>"+(x.company||"-")+"</td>"+
      "<td><strong>"+(x.apt||"-")+"</strong></td>"+
      "<td>"+(x.pages||8)+"/8</td>"+
      "<td>"+(x.time||"01:00")+"</td>"+
      "<td class='"+(x.valid?"valid":"waiting")+"'>"+
        (x.statusText || (x.valid?"유효열람 완료":"방문예약 접수"))+
      "</td>"+
      "<td>"+n(x.point)+"원 ("+(x.maskedPhone||"-")+")</td>"+
      "<td>"+n(x.charge)+"원</td>";

    el("rows").appendChild(tr);
  });

  el("v1").textContent=n(total)+"건";
  el("v2").textContent=n(valid)+"건";
  el("v3").textContent=n(point)+" P";
  el("v4").textContent=n(charge)+"원";
}

function search(){

  var sd=el("sd").value;
  var ed=el("ed").value;
  var rg=el("rg").value;

  var kw=
    el("kw")
    .value
    .trim()
    .toLowerCase();

  var result=D.filter(function(x){

    var date=String(x.date||"").slice(0,10);

    if(sd && date<sd){
      return false;
    }

    if(ed && date>ed){
      return false;
    }

    if(rg && x.region!==rg && String(x.regionLabel||"").indexOf(rg)===-1){
      return false;
    }

    var text=(
      (x.company||"")+" "+
      (x.apt||"")+" "+
      (x.regionLabel||"")
    ).toLowerCase();

    if(kw && !text.includes(kw)){
      return false;
    }

    return true;
  });

  show(result);
}

async function loadLiveInquiries(){
  var params = new URLSearchParams(window.location.search);
  var roomFilter = (params.get("room") || params.get("code") || "").trim().toUpperCase();
  var rooms = [];

  try {
    var res = await fetch("/api/sale-save");
    var data = await res.json();
    if(res.ok && data.ok && Array.isArray(data.rooms)){
      rooms = data.rooms;
    }
  } catch(e){}

  if(rooms.length === 0){
    try {
      rooms = JSON.parse(localStorage.getItem("wooriapt_replicated_rooms_v2") || "[]");
    } catch(e){}
  }

  var list = [];
  rooms.forEach(function(r){
    if(roomFilter && String(r.project_code || "").toUpperCase() !== roomFilter) return;
    var c = r.catalog_data || {};
    var sidoName = SIDO_MAP[c.sido || "seoul"] || "서울특별시";
    var hist = Array.isArray(c.issuedHistory) ? c.issuedHistory : [];
    hist.forEach(function(h){
      var amt = Number(h.rewardAmount || c.rewardAmount || 3000);
      list.push({
        date: fmtDate(h.issuedAt),
        region: sidoName,
        regionLabel: sidoName + (h.dong ? " · " + h.dong : ""),
        company: h.companyName || c.companyName || "-",
        apt: h.projectName || r.project_name || "-",
        pages: 8,
        time: "01:00 완료",
        valid: true,
        statusText: "60초 유효열람",
        maskedPhone: h.phone || "010-****-****",
        point: amt,
        charge: amt
      });
    });

    var visits = Array.isArray(c.visitReservations) ? c.visitReservations : [];
    visits.forEach(function(v){
      list.push({
        date: fmtDate(v.createdAt),
        region: sidoName,
        regionLabel: sidoName + (v.dong ? " · " + v.dong : ""),
        company: v.companyName || c.companyName || "-",
        apt: v.projectName || r.project_name || "-",
        pages: 8,
        time: "희망일: " + (v.visitDate || "-"),
        valid: true,
        statusText: "방문예약 신청",
        maskedPhone: v.phone || "010-****-****",
        point: 0,
        charge: 0
      });
    });
  });

  list.sort(function(a, b){
    return String(b.date || "").localeCompare(String(a.date || ""));
  });

  D = list;
  search();
}

el("searchBtn").onclick=function(){
  loadLiveInquiries();
};

el("kw").addEventListener(
  "keydown",
  function(e){
    if(e.key==="Enter"){
      search();
    }
  }
);

var today=new Date();

el("ed").value=
  today.toISOString().slice(0,10);

var firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
el("sd").value=
  firstDay.toISOString().slice(0,10);

loadLiveInquiries();

})();
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">
<title>매수요청 조회 | 우리아파트 안심거래</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f7fa;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:0 16px 50px;
}

/* HEADER */

.header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#173f67;
  font-size:15px;
  font-weight:800;
  text-decoration:none;
}

.logo-mark{
  font-size:27px;
}

.logo strong{
  display:block;
  color:#1165d7;
  font-size:18px;
}

/* PAGE HEAD */

.page-head{
  margin:24px 0 20px;
}

.page-head h1{
  margin:0;
  font-size:30px;
  letter-spacing:-1px;
}

.page-head p{
  margin:9px 0 0;
  color:#6d7f8d;
  font-size:14px;
  line-height:1.5;
}

/* GUIDE */

.guide{
  margin-bottom:18px;
  padding:16px 18px;
  border:1px solid #d9e7f3;
  border-radius:15px;
  background:#eef6ff;
  color:#315875;
  font-size:14px;
  line-height:1.6;
}

/* SEARCH */

.search-box{
  padding:20px;
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(23,63,103,.05);
}

.search-title{
  margin:0 0 10px;
  font-size:18px;
  color:#173f67;
}

.search-desc{
  margin:0 0 14px;
  color:#718291;
  font-size:13px;
}

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
  min-width:0;
  height:46px;
  padding:0 14px;
  border:1px solid #cbd8e3;
  border-radius:11px;
  outline:none;
  font-size:18px;
  letter-spacing:1px;
}

.search-row input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.08);
}

.search-row button{
  width:92px;
  border:0;
  border-radius:11px;
  background:#1165d7;
  color:#fff;
  font-weight:800;
}

/* RESULT */

.result{
  display:none;
  margin-top:22px;
}

.result-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.result-head h2{
  margin:0;
  font-size:21px;
}

.result-count{
  color:#1165d7;
  font-weight:900;
}

.result-note{
  margin:0 0 14px;
  color:#718291;
  font-size:13px;
}

/* PROPERTY */

.property-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.property{
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:17px;
  padding:18px;
  box-shadow:0 4px 15px rgba(23,63,103,.04);
}

.property-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.property-name{
  margin:0;
  font-size:19px;
  color:#173f67;
}

.my-property{
  flex:none;
  padding:5px 9px;
  border-radius:999px;
  background:#eef6ff;
  color:#1165d7;
  font-size:11px;
  font-weight:900;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-top:1px solid #edf1f4;
  border-bottom:1px solid #edf1f4;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 4px;
  font-size:14px;
}

.info span:first-child{
  color:#7b8b97;
}

.info span:last-child{
  color:#263e50;
  font-weight:800;
}

.property-desc{
  margin:13px 0 0;
  color:#647887;
  font-size:13px;
  line-height:1.6;
}

/* EMPTY */

.empty{
  display:none;
  margin-top:22px;
  padding:48px 20px;
  text-align:center;
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:18px;
}

.empty-icon{
  font-size:38px;
}

.empty h2{
  margin:12px 0 7px;
  font-size:19px;
}

.empty p{
  margin:0;
  color:#718291;
  font-size:13px;
  line-height:1.6;
}

/* FOOTER */

.footer{
  margin-top:35px;
  padding-top:20px;
  border-top:1px solid #dce5ec;
  color:#7b8994;
  font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .page-head h1{
    font-size:25px;
  }

  .search-box{
    padding:16px;
  }

  .search-row input{
    font-size:16px;
  }

  .search-row button{
    width:76px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .property{
    padding:16px;
  }

  .property-name{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
  <a class="logo" href="/">
    <span class="logo-mark">🏠</span>
    <span>
      우리아파트
      <strong>안심거래</strong>
    </span>
  </a>
</header>


<section class="page-head">

  <h1>매수요청 조회</h1>

  <p>
    매수요청번호를 입력하면 해당 요청에 등록된 매물을 확인할 수 있습니다.
  </p>

</section>


<div class="guide">
  이 화면은 매수요청에 등록된 매물을 확인하는 화면입니다.
  매수자의 선택 여부나 다른 중개사의 정보는 표시되지 않습니다.
</div>


<section class="search-box">

  <h2 class="search-title">
    매수요청번호 입력
  </h2>

  <p class="search-desc">
    중개사에게 전달받은 매수요청번호를 입력해 주세요.
  </p>

  <div class="search-row">

    <input
      id="requestNumber"
      type="text"
      inputmode="numeric"
      maxlength="10"
      autocomplete="off"
      placeholder="매수요청번호"
      aria-label="매수요청번호">

    <button
      id="searchBtn"
      type="button">
      조회
    </button>

  </div>

</section>


<section
  class="result"
  id="result">

  <div class="result-head">

    <h2>
      등록 매물
      <span
        class="result-count"
        id="resultCount">
        0건
      </span>
    </h2>

  </div>

  <p class="result-note">
    현재 이 매수요청에 등록되어 있는 매물입니다.
  </p>


  <div
    class="property-list"
    id="propertyList">
  </div>

</section>


<section
  class="empty"
  id="empty">

  <div class="empty-icon">
    🔎
  </div>

  <h2>
    등록된 매물이 없습니다.
  </h2>

  <p>
    현재 이 매수요청에 등록된 매물이 없습니다.
  </p>

</section>


<footer class="footer">
  © 우리아파트 안심거래. All rights reserved.
</footer>

</div>


<script>

"use strict";


/*
  ---------------------------------------
  임시 조회 데이터
  ---------------------------------------

  실제 운영에서는 Supabase의
  매물 데이터와 연결합니다.

  같은 매수요청번호에 여러 중개사의
  매물이 등록될 수 있습니다.
*/

const propertyData = {

  "1234":[

    {
      apartment:"광주 양산동 ○○아파트",
      type:"매매",
      price:"○억 ○천만원",
      floor:"12층",
      area:"84㎡",
      description:"매수 요청 조건에 맞는 매물입니다.",
      mine:true
    },

    {
      apartment:"광주 양산동 △△아파트",
      type:"매매",
      price:"○억 ○백만원",
      floor:"8층",
      area:"84㎡",
      description:"매수 요청 조건에 맞는 매물입니다.",
      mine:false
    },

    {
      apartment:"광주 양산동 □□아파트",
      type:"매매",
      price:"○억 ○천만원",
      floor:"15층",
      area:"101㎡",
      description:"매수 요청 조건에 맞는 매물입니다.",
      mine:false
    }

  ]

};


/* 숫자만 입력 */

const requestNumber =
  document.getElementById("requestNumber");

requestNumber.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/[^0-9]/g,"")
      .slice(0,10);

  }
);


/* 조회 */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    searchRequest
  );


requestNumber.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      e.preventDefault();
      searchRequest();
    }

  }
);


function searchRequest(){

  const number =
    requestNumber.value.trim();

  if(!number){

    alert(
      "매수요청번호를 입력해 주세요."
    );

    requestNumber.focus();

    return;
  }


  const list =
    propertyData[number] || [];


  const result =
    document.getElementById("result");

  const empty =
    document.getElementById("empty");

  const propertyList =
    document.getElementById("propertyList");

  const resultCount =
    document.getElementById("resultCount");


  propertyList.innerHTML="";


  if(list.length===0){

    result.style.display="none";
    empty.style.display="block";

    return;

  }


  empty.style.display="none";
  result.style.display="block";


  resultCount.textContent =
    list.length + "건";


  list.forEach(
    function(item){

      const article =
        document.createElement("article");

      article.className="property";


      article.innerHTML=`

        <div class="property-top">

          <h3 class="property-name">
            ${item.apartment}
          </h3>

          ${
            item.mine
            ? '<span class="my-property">내 등록 매물</span>'
            : ''
          }

        </div>


        <div class="info-grid">

          <div class="info">
            <span>거래</span>
            <span>${item.type}</span>
          </div>

          <div class="info">
            <span>금액</span>
            <span>${item.price}</span>
          </div>

          <div class="info">
            <span>층수</span>
            <span>${item.floor}</span>
          </div>

          <div class="info">
            <span>면적</span>
            <span>${item.area}</span>
          </div>

        </div>


        <p class="property-desc">
          ${item.description}
        </p>

      `;


      propertyList.appendChild(article);

    }
  );

}

</script>

</body>
</html>

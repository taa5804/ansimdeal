<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>플랫폼 서비스 이용료 | 우리아파트 안심거래</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    Arial,
    sans-serif;
}

button,
input{
  font:inherit;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:0 14px 50px;
}


/* =========================
   상단
========================= */

.header{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  font-weight:800;
  color:#173f67;
}

.logo-mark{
  font-size:26px;
}

.logo strong{
  display:block;
  color:#1165d7;
  font-size:18px;
}

.home-btn{
  padding:9px 13px;
  border:1px solid #cbd9e5;
  border-radius:9px;
  background:#fff;
  font-size:13px;
  font-weight:800;
  color:#24577e;
}


/* =========================
   제목
========================= */

.head{
  margin-top:12px;
  padding:26px 22px;
  background:#fff;
  border:1px solid #dce6ee;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(15,23,42,.04);
}

.head h1{
  margin:0;
  font-size:27px;
  color:#173f67;
  letter-spacing:-.8px;
}

.head p{
  margin:10px 0 0;
  color:#667b8d;
  font-size:14px;
  line-height:1.6;
}


/* =========================
   거래 유형
========================= */

.type-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.type-btn{
  height:52px;
  border:1px solid #cbd9e5;
  border-radius:11px;
  background:#fff;
  color:#314b61;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.type-btn.active{
  border-color:#1165d7;
  background:#1165d7;
  color:#fff;
}


/* =========================
   입력
========================= */

.calculator{
  margin-top:12px;
  padding:22px;
  background:#fff;
  border:1px solid #dce6ee;
  border-radius:18px;
}

.input-group{
  margin-bottom:15px;
}

.input-group:last-child{
  margin-bottom:0;
}

.input-group label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:900;
  color:#314b61;
}

.money-box{
  display:flex;
  align-items:center;
  gap:7px;
}

.money-box input{
  width:100%;
  height:50px;
  padding:0 13px;
  border:1px solid #cbd9e5;
  border-radius:10px;
  outline:none;
  font-size:18px;
  font-weight:800;
  text-align:right;
}

.money-box input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

.unit{
  flex:0 0 auto;
  font-size:14px;
  font-weight:800;
}

.hidden{
  display:none !important;
}

.calc-btn{
  width:100%;
  height:54px;
  margin-top:18px;
  border:0;
  border-radius:11px;
  background:#1165d7;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.payment-btn{
  display:none;
  width:100%;
  height:54px;
  margin-top:10px;
  border:0;
  border-radius:11px;
  background:#1c9b74;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}


/* =========================
   결과
========================= */

.result{
  display:none;
  margin-top:16px;
}

.result.show{
  display:block;
}

.result-title{
  margin:0 0 10px;
  font-size:19px;
  font-weight:900;
  color:#173f67;
}

.compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.compare-card{
  min-width:0;
  padding:20px 12px;
  border:1px solid #dce6ee;
  border-radius:16px;
  background:#fff;
  text-align:center;
}

.compare-card.platform{
  border:2px solid #1165d7;
  background:#f2f7ff;
}

.compare-label{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#53697b;
  font-size:13px;
  font-weight:900;
  line-height:1.4;
}

.compare-card.platform .compare-label{
  color:#1165d7;
}

.price{
  margin-top:10px;
  font-size:25px;
  font-weight:950;
  color:#172b3d;
  letter-spacing:-1px;
}

.platform .price{
  color:#1165d7;
}

.vat{
  margin-top:5px;
  color:#718291;
  font-size:11px;
  font-weight:700;
}

.detail{
  margin-top:10px;
  padding:13px 15px;
  border-radius:11px;
  background:#eef4f8;
  color:#53697b;
  font-size:12px;
  line-height:1.7;
}


/* =========================
   안내
========================= */

.notice{
  margin-top:16px;
  padding:17px;
  border:1px solid #d9e5ef;
  border-radius:14px;
  background:#fff;
}

.notice strong{
  display:block;
  margin-bottom:7px;
  color:#173f67;
  font-size:14px;
}

.notice p{
  margin:0;
  color:#617687;
  font-size:12px;
  line-height:1.7;
}


/* =========================
   모바일
========================= */

@media(max-width:480px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .head{
    padding:21px 17px;
  }

  .head h1{
    font-size:22px;
  }

  .type-btn{
    height:47px;
    font-size:14px;
  }

  .calculator{
    padding:17px 14px;
  }

  .money-box input{
    font-size:17px;
  }

  .compare{
    gap:6px;
  }

  .compare-card{
    padding:17px 7px;
  }

  .compare-label{
    font-size:11px;
  }

  .price{
    font-size:20px;
  }

}
</style>
</head>


<body>

<div class="wrap">


<!-- =========================
     상단
========================= -->

<header class="header">

  <a class="logo" href="/">

    <span class="logo-mark">
      🏠
    </span>

    <span>
      우리아파트
      <strong>
        안심거래
      </strong>
    </span>

  </a>


  <a
    class="home-btn"
    href="/"
  >
    메인으로
  </a>

</header>


<!-- =========================
     제목
========================= -->

<section class="head">

  <h1>
    플랫폼 서비스 이용료
  </h1>

  <p>
    거래 유형과 금액을 입력하면
    요율표 기준 예상금액과
    우리아파트 안심거래 플랫폼 서비스 이용료를
    확인할 수 있습니다.
  </p>

</section>


<!-- =========================
     거래유형
========================= -->

<div class="type-tabs">

  <button
    type="button"
    class="type-btn active"
    data-type="sale"
  >
    매매
  </button>

  <button
    type="button"
    class="type-btn"
    data-type="jeonse"
  >
    전세
  </button>

  <button
    type="button"
    class="type-btn"
    data-type="monthly"
  >
    월세
  </button>

</div>


<!-- =========================
     계산기
========================= -->

<section class="calculator">


  <!-- 매매 -->

  <div
    id="saleFields"
    class="field-area"
  >

    <div class="input-group">

      <label for="salePrice">
        매매금액
      </label>

      <div class="money-box">

        <input
          id="salePrice"
          type="text"
          inputmode="numeric"
          placeholder="예: 300000000"
        >

        <span class="unit">
          원
        </span>

      </div>

    </div>

  </div>


  <!-- 전세 -->

  <div
    id="jeonseFields"
    class="field-area hidden"
  >

    <div class="input-group">

      <label for="jeonsePrice">
        전세보증금
      </label>

      <div class="money-box">

        <input
          id="jeonsePrice"
          type="text"
          inputmode="numeric"
          placeholder="예: 200000000"
        >

        <span class="unit">
          원
        </span>

      </div>

    </div>

  </div>


  <!-- 월세 -->

  <div
    id="monthlyFields"
    class="field-area hidden"
  >

    <div class="input-group">

      <label for="monthlyDeposit">
        보증금
      </label>

      <div class="money-box">

        <input
          id="monthlyDeposit"
          type="text"
          inputmode="numeric"
          placeholder="예: 10000000"
        >

        <span class="unit">
          원
        </span>

      </div>

    </div>


    <div class="input-group">

      <label for="monthlyRent">
        월세
      </label>

      <div class="money-box">

        <input
          id="monthlyRent"
          type="text"
          inputmode="numeric"
          placeholder="예: 500000"
        >

        <span class="unit">
          원
        </span>

      </div>

    </div>

  </div>


  <button
    id="calcBtn"
    class="calc-btn"
    type="button"
  >
    이용료 확인
  </button>


  <button
    id="paymentBtn"
    class="payment-btn"
    type="button"
  >
    플랫폼 서비스 이용료 입금하기
  </button>

</section>


<!-- =========================
     결과
========================= -->

<section
  id="result"
  class="result"
>

  <h2 class="result-title">
    이용금액 비교
  </h2>


  <div class="compare">


    <div class="compare-card">

      <div class="compare-label">
        요율표 기준<br>
        예상금액
      </div>

      <div
        id="normalPrice"
        class="price"
      >
        0원
      </div>

      <div class="vat">
        부가세 포함
      </div>

    </div>


    <div class="compare-card platform">

      <div class="compare-label">
        플랫폼 서비스<br>
        이용료
      </div>

      <div
        id="platformPrice"
        class="price"
      >
        0원
      </div>

      <div class="vat">
        부가세 포함
      </div>

    </div>


  </div>


  <div
    id="detail"
    class="detail"
  >
  </div>

</section>


<!-- =========================
     안내
========================= -->

<section class="notice">

  <strong>
    이용료 안내
  </strong>

  <p>
    우리아파트 안심거래 플랫폼 서비스 이용료는
    공인중개사의 중개보수와 별개의
    플랫폼 서비스 이용대가입니다.
    표시된 요율표 기준 금액은 예상금액이며,
    실제 중개보수는 거래 조건 등에 따라 달라질 수 있습니다.
  </p>

</section>


</div>


<script>

(function(){

"use strict";


/* =========================
   기본값
========================= */

let currentType =
  "sale";


let calculatedPlatformBase =
  0;


const typeButtons =
  document.querySelectorAll(
    ".type-btn"
  );


const saleFields =
  document.getElementById(
    "saleFields"
  );


const jeonseFields =
  document.getElementById(
    "jeonseFields"
  );


const monthlyFields =
  document.getElementById(
    "monthlyFields"
  );


const result =
  document.getElementById(
    "result"
  );


const normalPrice =
  document.getElementById(
    "normalPrice"
  );


const platformPrice =
  document.getElementById(
    "platformPrice"
  );


const detail =
  document.getElementById(
    "detail"
  );


const calcBtn =
  document.getElementById(
    "calcBtn"
  );


const paymentBtn =
  document.getElementById(
    "paymentBtn"
  );


/* =========================
   숫자 처리
========================= */

function numberOnly(value){

  return Number(
    String(value || "")
      .replace(
        /[^0-9]/g,
        ""
      )
  ) || 0;

}


function formatWon(value){

  return Math.round(value)
    .toLocaleString(
      "ko-KR"
    ) +
    "원";

}


function formatInput(input){

  const number =
    numberOnly(
      input.value
    );


  if(!number){

    input.value =
      "";

    return;

  }


  input.value =
    number
      .toLocaleString(
        "ko-KR"
      );

}


/* =========================
   거래유형 선택
========================= */

typeButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        currentType =
          this.dataset.type;


        typeButtons.forEach(
          btn => {

            btn
              .classList
              .remove(
                "active"
              );

          }
        );


        this
          .classList
          .add(
            "active"
          );


        saleFields
          .classList
          .add(
            "hidden"
          );


        jeonseFields
          .classList
          .add(
            "hidden"
          );


        monthlyFields
          .classList
          .add(
            "hidden"
          );


        if(
          currentType ===
          "sale"
        ){

          saleFields
            .classList
            .remove(
              "hidden"
            );

        }


        if(
          currentType ===
          "jeonse"
        ){

          jeonseFields
            .classList
            .remove(
              "hidden"
            );

        }


        if(
          currentType ===
          "monthly"
        ){

          monthlyFields
            .classList
            .remove(
              "hidden"
            );

        }


        result
          .classList
          .remove(
            "show"
          );


        paymentBtn.style.display =
          "none";


        calculatedPlatformBase =
          0;

      }
    );

  }
);


/* =========================
   입력금액 콤마
========================= */

document
  .querySelectorAll(
    ".money-box input"
  )
  .forEach(
    input => {

      input.addEventListener(
        "input",
        function(){

          formatInput(
            this
          );

        }
      );

    }
  );


/* =========================
   매매 내부 요율 계산
========================= */

function calculateSaleFee(
  price
){

  let rate =
    0;

  let limit =
    Infinity;


  if(
    price <
    50000000
  ){

    rate =
      0.006;

    limit =
      250000;

  }

  else if(
    price <
    200000000
  ){

    rate =
      0.005;

    limit =
      800000;

  }

  else if(
    price <
    900000000
  ){

    rate =
      0.004;

  }

  else if(
    price <
    1200000000
  ){

    rate =
      0.005;

  }

  else if(
    price <
    1500000000
  ){

    rate =
      0.006;

  }

  else{

    rate =
      0.007;

  }


  return Math.min(
    price * rate,
    limit
  );

}


/* =========================
   전세·월세 내부 요율 계산
========================= */

function calculateRentFee(
  price
){

  let rate =
    0;

  let limit =
    Infinity;


  if(
    price <
    50000000
  ){

    rate =
      0.005;

    limit =
      200000;

  }

  else if(
    price <
    100000000
  ){

    rate =
      0.004;

    limit =
      300000;

  }

  else if(
    price <
    600000000
  ){

    rate =
      0.003;

  }

  else if(
    price <
    1200000000
  ){

    rate =
      0.004;

  }

  else if(
    price <
    1500000000
  ){

    rate =
      0.005;

  }

  else{

    rate =
      0.006;

  }


  return Math.min(
    price * rate,
    limit
  );

}


/* =========================
   이용료 계산
========================= */

calcBtn
  .addEventListener(
    "click",
    function(){

      let transactionPrice =
        0;


      let baseFee =
        0;


      /* =====================
         매매
      ===================== */

      if(
        currentType ===
        "sale"
      ){

        transactionPrice =
          numberOnly(
            document
              .getElementById(
                "salePrice"
              )
              .value
          );


        if(
          !transactionPrice
        ){

          alert(
            "매매금액을 입력해 주세요."
          );

          return;

        }


        baseFee =
          calculateSaleFee(
            transactionPrice
          );

      }


      /* =====================
         전세
      ===================== */

      if(
        currentType ===
        "jeonse"
      ){

        transactionPrice =
          numberOnly(
            document
              .getElementById(
                "jeonsePrice"
              )
              .value
          );


        if(
          !transactionPrice
        ){

          alert(
            "전세보증금을 입력해 주세요."
          );

          return;

        }


        baseFee =
          calculateRentFee(
            transactionPrice
          );

      }


      /* =====================
         월세
      ===================== */

      if(
        currentType ===
        "monthly"
      ){

        const deposit =
          numberOnly(
            document
              .getElementById(
                "monthlyDeposit"
              )
              .value
          );


        const rent =
          numberOnly(
            document
              .getElementById(
                "monthlyRent"
              )
              .value
          );


        if(
          !rent
        ){

          alert(
            "월세를 입력해 주세요."
          );

          return;

        }


        /*
          월세 거래금액
          보증금 + 월세 × 100
        */

        transactionPrice =
          deposit +
          (
            rent *
            100
          );


        /*
          5천만원 미만이면
          월세 × 70 적용
        */

        if(
          transactionPrice <
          50000000
        ){

          transactionPrice =
            deposit +
            (
              rent *
              70
            );

        }


        baseFee =
          calculateRentFee(
            transactionPrice
          );

      }


      /* =====================
         플랫폼 서비스 이용료
         내부 기준 50%
      ===================== */

      calculatedPlatformBase =
        Math.round(
          baseFee *
          0.5
        );


      /*
        요율표 기준 금액
        부가세 포함
      */

      const normalWithVat =
        Math.round(
          baseFee *
          1.1
        );


      /*
        플랫폼 서비스 이용료
        부가세 포함
      */

      const platformWithVat =
        Math.round(
          calculatedPlatformBase *
          1.1
        );


      normalPrice
        .textContent =
        formatWon(
          normalWithVat
        );


      platformPrice
        .textContent =
        formatWon(
          platformWithVat
        );


      detail
        .textContent =
        "표시 금액은 부가가치세를 포함한 예상금액입니다.";


      result
        .classList
        .add(
          "show"
        );


      paymentBtn.style.display =
        "block";


      result
        .scrollIntoView({

          behavior:
            "smooth",

          block:
            "nearest"

        });

    }
  );


/* =========================
   입금확인 페이지 이동
========================= */

paymentBtn
  .addEventListener(
    "click",
    function(){

      if(
        !calculatedPlatformBase
      ){

        alert(
          "먼저 플랫폼 서비스 이용료를 확인해 주세요."
        );

        return;

      }


      /*
        중요:
        VAT 제외 플랫폼 서비스 이용료를 저장합니다.
        service-fee-payment.html에서
        VAT 10%를 한 번만 계산합니다.
      */

      localStorage
        .setItem(
          "wooriapt_service_fee",
          String(
            calculatedPlatformBase
          )
        );


      localStorage
        .setItem(
          "wooriapt_service_type",
          currentType
        );


      location.href =
        "/service-fee-payment.html";

    }
  );


})();

</script>

</body>
</html>

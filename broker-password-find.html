<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>비밀번호 찾기 | 우리아파트 안심거래</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:24px 14px 55px;
}

.head{
  margin-bottom:18px;
}

.brand{
  margin-bottom:10px;
  color:#1165d7;
  font-size:15px;
  font-weight:800;
}

h1{
  margin:0 0 8px;
  color:#13283c;
  font-size:27px;
  line-height:1.35;
}

.head p{
  margin:0;
  color:#667789;
  font-size:14px;
  line-height:1.6;
}

.box{
  padding:22px 18px;
  border:1px solid #dce4ec;
  border-radius:16px;
  background:#fff;
  box-shadow:0 5px 18px rgba(27,52,78,.06);
}

.step{
  display:none;
}

.step.active{
  display:block;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:800;
}

input{
  width:100%;
  height:48px;
  padding:0 12px;
  border:1px solid #cfd9e3;
  border-radius:10px;
  outline:0;
  background:#fff;
  color:#172b3d;
  font-size:17px;
}

input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

.phone-wrap{
  display:flex;
  align-items:center;
  width:100%;
  border:1px solid #cfd9e3;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.phone-wrap:focus-within{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

.phone-prefix{
  padding:0 12px;
  border-right:1px solid #dce4ec;
  color:#172b3d;
  font-size:18px;
  font-weight:800;
}

#phone{
  flex:1;
  min-width:0;
  border:0;
  border-radius:0;
  box-shadow:none;
  font-size:18px;
  font-weight:700;
}

.help{
  margin:8px 0 0;
  color:#758493;
  font-size:12px;
  line-height:1.5;
}

.email-info{
  margin:0 0 16px;
  padding:13px;
  border-radius:10px;
  background:#eef5ff;
  color:#42566b;
  font-size:13px;
  line-height:1.6;
}

.btn{
  width:100%;
  height:50px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:#1165d7;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:default;
}

.sub-btn{
  width:100%;
  height:46px;
  margin-top:9px;
  border:1px solid #bdd4ee;
  border-radius:10px;
  background:#f7fbff;
  color:#1165d7;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.msg{
  min-height:22px;
  margin-top:12px;
  font-size:13px;
  font-weight:700;
}

.msg.error{
  color:#d93838;
}

.msg.ok{
  color:#168548;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#647789;
  font-size:13px;
  font-weight:700;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">

    <div class="brand">
      우리아파트 안심거래
    </div>

    <h1>
      비밀번호 찾기
    </h1>

    <p>
      가입 시 등록한 이메일로 4자리 인증번호를 발송합니다.
    </p>

  </div>


  <div class="box">


    <!-- 1단계 -->
    <section
      id="step1"
      class="step active">

      <div class="field">

        <label for="phone">
          휴대전화번호(ID)
        </label>

        <div class="phone-wrap">

          <div class="phone-prefix">
            010-
          </div>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            maxlength="8"
            placeholder="12345678">

        </div>

        <p class="help">
          휴대전화번호 뒤 8자리를 입력해 주세요.
        </p>

      </div>

      <button
        id="sendCodeBtn"
        class="btn"
        type="button">
        이메일로 인증번호 받기
      </button>

    </section>


    <!-- 2단계 -->
    <section
      id="step2"
      class="step">

      <div
        id="emailInfo"
        class="email-info">
      </div>

      <div class="field">

        <label for="verifyCode">
          4자리 인증번호
        </label>

        <input
          id="verifyCode"
          type="tel"
          inputmode="numeric"
          maxlength="4"
          placeholder="0000">

        <p class="help">
          인증번호는 5분 동안 사용할 수 있습니다.
        </p>

      </div>

      <button
        id="verifyBtn"
        class="btn"
        type="button">
        인증번호 확인
      </button>

      <button
        id="resendBtn"
        class="sub-btn"
        type="button">
        인증번호 다시 받기
      </button>

    </section>


    <!-- 3단계 -->
    <section
      id="step3"
      class="step">

      <div class="field">

        <label for="newPassword">
          새 비밀번호
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호를 입력하세요">

      </div>


      <div class="field">

        <label for="newPasswordConfirm">
          새 비밀번호 확인
        </label>

        <input
          id="newPasswordConfirm"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호를 다시 입력하세요">

      </div>

      <button
        id="changePasswordBtn"
        class="btn"
        type="button">
        새 비밀번호 저장
      </button>

    </section>


    <div
      id="msg"
      class="msg"
      aria-live="polite">
    </div>

  </div>


  <a
    class="back"
    href="/broker-login.html">
    ← 로그인으로 돌아가기
  </a>

</div>


<script>
(function(){

"use strict";


/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://wpshlmijsscmlasqtapa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3QLYewR-TXBd1mNfte6OJg_kre42L7K";


/* =====================================================
   이메일 인증 API
   Vercel API에서 연결
===================================================== */

const EMAIL_CODE_API =
  "/api/broker-password-code";


/* =====================================================
   DOM
===================================================== */

const step1 =
  document.getElementById("step1");

const step2 =
  document.getElementById("step2");

const step3 =
  document.getElementById("step3");

const phone =
  document.getElementById("phone");

const verifyCode =
  document.getElementById("verifyCode");

const newPassword =
  document.getElementById("newPassword");

const newPasswordConfirm =
  document.getElementById("newPasswordConfirm");

const sendCodeBtn =
  document.getElementById("sendCodeBtn");

const resendBtn =
  document.getElementById("resendBtn");

const verifyBtn =
  document.getElementById("verifyBtn");

const changePasswordBtn =
  document.getElementById("changePasswordBtn");

const emailInfo =
  document.getElementById("emailInfo");

const msg =
  document.getElementById("msg");


/* =====================================================
   상태
===================================================== */

let currentPhone = "";
let verified = false;


/* =====================================================
   메시지
===================================================== */

function showMessage(type,text){

  msg.className =
    "msg " + type;

  msg.textContent =
    text;

}


/* =====================================================
   단계 전환
===================================================== */

function showStep(number){

  step1.classList.remove("active");
  step2.classList.remove("active");
  step3.classList.remove("active");

  if(number === 1){
    step1.classList.add("active");
  }

  if(number === 2){
    step2.classList.add("active");
  }

  if(number === 3){
    step3.classList.add("active");
  }

}


/* =====================================================
   이메일 일부 숨김
===================================================== */

function maskEmail(email){

  const parts =
    String(email || "").split("@");

  if(parts.length !== 2){
    return "";
  }

  const name =
    parts[0];

  const domain =
    parts[1];

  let maskedName = "";

  if(name.length <= 2){

    maskedName =
      name.charAt(0) + "*";

  }else{

    maskedName =
      name.slice(0,2) +
      "*".repeat(
        Math.max(2,name.length - 2)
      );

  }

  return maskedName + "@" + domain;

}


/* =====================================================
   Base64
===================================================== */

function bytesToBase64(bytes){

  let binary = "";

  for(
    let i = 0;
    i < bytes.length;
    i++
  ){

    binary +=
      String.fromCharCode(bytes[i]);

  }

  return btoa(binary);

}


/* =====================================================
   새 비밀번호 해시
===================================================== */

async function hashPassword(passwordValue){

  const encoder =
    new TextEncoder();

  const saltBytes =
    crypto.getRandomValues(
      new Uint8Array(16)
    );

  const keyMaterial =
    await crypto.subtle.importKey(
      "raw",
      encoder.encode(passwordValue),
      "PBKDF2",
      false,
      ["deriveBits"]
    );

  const derivedBits =
    await crypto.subtle.deriveBits(
      {
        name:"PBKDF2",
        salt:saltBytes,
        iterations:210000,
        hash:"SHA-256"
      },
      keyMaterial,
      256
    );

  return {
    salt:bytesToBase64(saltBytes),
    hash:bytesToBase64(
      new Uint8Array(derivedBits)
    )
  };

}


/* =====================================================
   숫자 제한
===================================================== */

phone.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/\D/g,"")
      .slice(0,8);

  }
);


verifyCode.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/\D/g,"")
      .slice(0,4);

  }
);


/* =====================================================
   인증번호 발송
===================================================== */

async function sendVerificationCode(){

  msg.className =
    "msg";

  msg.textContent =
    "";


  if(phone.value.length !== 8){

    showMessage(
      "error",
      "휴대전화번호 뒤 8자리를 정확히 입력해 주세요."
    );

    phone.focus();

    return;

  }


  currentPhone =
    "010" + phone.value;


  sendCodeBtn.disabled =
    true;

  resendBtn.disabled =
    true;


  try{


    const response =
      await fetch(
        EMAIL_CODE_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              phone:currentPhone
            })
        }
      );


    const result =
      await response.json()
      .catch(
        () => ({})
      );


    if(!response.ok){

      throw new Error(
        result.message ||
        "인증번호를 발송하지 못했습니다."
      );

    }


    emailInfo.textContent =
      (result.maskedEmail || "등록된 이메일") +
      "로 4자리 인증번호를 발송했습니다.";


    showStep(2);


    showMessage(
      "ok",
      "인증번호가 발송되었습니다."
    );


    verifyCode.focus();


  }catch(error){

    console.error(error);

    showMessage(
      "error",
      error.message ||
      "인증번호 발송 중 오류가 발생했습니다."
    );

  }finally{

    sendCodeBtn.disabled =
      false;

    resendBtn.disabled =
      false;

  }

}


sendCodeBtn.addEventListener(
  "click",
  sendVerificationCode
);


resendBtn.addEventListener(
  "click",
  sendVerificationCode
);


/* =====================================================
   인증번호 확인
===================================================== */

verifyBtn.addEventListener(
  "click",
  async function(){

    if(verifyCode.value.length !== 4){

      showMessage(
        "error",
        "4자리 인증번호를 입력해 주세요."
      );

      verifyCode.focus();

      return;

    }


    verifyBtn.disabled =
      true;


    try{


      const response =
        await fetch(
          EMAIL_CODE_API,
          {
            method:"PUT",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                phone:currentPhone,
                code:verifyCode.value
              })
          }
        );


      const result =
        await response.json()
        .catch(
          () => ({})
        );


      if(!response.ok){

        throw new Error(
          result.message ||
          "인증번호가 일치하지 않습니다."
        );

      }


      verified =
        true;


      showStep(3);


      showMessage(
        "ok",
        "이메일 인증이 완료되었습니다."
      );


      newPassword.focus();


    }catch(error){

      showMessage(
        "error",
        error.message ||
        "인증번호 확인 중 오류가 발생했습니다."
      );

    }finally{

      verifyBtn.disabled =
        false;

    }

  }
);


/* =====================================================
   새 비밀번호 저장
===================================================== */

changePasswordBtn.addEventListener(
  "click",
  async function(){

    if(!verified){

      showMessage(
        "error",
        "이메일 인증을 먼저 완료해 주세요."
      );

      return;

    }


    const passwordValue =
      newPassword.value;

    const passwordConfirmValue =
      newPasswordConfirm.value;


    if(passwordValue.length < 8){

      showMessage(
        "error",
        "새 비밀번호는 8자 이상 입력해 주세요."
      );

      newPassword.focus();

      return;

    }


    if(
      passwordValue !==
      passwordConfirmValue
    ){

      showMessage(
        "error",
        "새 비밀번호가 서로 일치하지 않습니다."
      );

      newPasswordConfirm.focus();

      return;

    }


    changePasswordBtn.disabled =
      true;

    changePasswordBtn.textContent =
      "저장 중...";


    try{


      const passwordData =
        await hashPassword(
          passwordValue
        );


      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/agent_members" +
          "?phone=eq." +
          encodeURIComponent(
            currentPhone
          ),

          {
            method:"PATCH",

            headers:{
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify({

                password_hash:
                  passwordData.hash,

                password_salt:
                  passwordData.salt

              })

          }

        );


      if(!response.ok){

        throw new Error(
          "새 비밀번호를 저장하지 못했습니다."
        );

      }


      showMessage(
        "ok",
        "비밀번호가 변경되었습니다. 로그인 화면으로 이동합니다."
      );


      setTimeout(
        function(){

          location.href =
            "/broker-login.html";

        },
        1200
      );


    }catch(error){

      console.error(error);

      showMessage(
        "error",
        error.message ||
        "비밀번호 변경 중 오류가 발생했습니다."
      );

    }finally{

      changePasswordBtn.disabled =
        false;

      changePasswordBtn.textContent =
        "새 비밀번호 저장";

    }

  }
);


})();
</script>

</body>
</html>

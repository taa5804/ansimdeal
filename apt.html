  <script>
  const REGIONS = {
    "전남광주통합특별시": ["북구", "광산구", "서구", "남구", "동구", "순천시", "여수시", "목포시", "나주시", "광양시", "담양군", "화순군"],
    "서울특별시": ["강남구", "서초구", "송파구", "강동구", "마포구", "용산구", "성동구", "영등포구", "노원구", "강북구"],
    "경기도": ["수원시", "성남시", "용인시", "고양시", "화성시", "오산시", "평택시", "안양시", "부천시", "남양주시"],
    "인천광역시": ["연수구", "남동구", "서구", "부평구", "미추홀구", "중구"],
    "부산광역시": ["해운대구", "수영구", "부산진구", "동래구", "남구", "북구", "사하구"],
    "대구광역시": ["수성구", "달서구", "중구", "동구", "북구"],
    "대전광역시": ["유성구", "서구", "중구", "동구", "대덕구"],
    "세종특별자치시": ["세종시"]
  };

  let curSido = '전남광주통합특별시';
  let curSigungu = '북구';
  let curDong = '일곡동';
  let curType = 'sale';
  let curBudget = 20000;
  let curRentDeposit = 2000;
  let curRentMonthly = 65;

  let loadedApts = [];
  let dongDebounceTimer = null;

  async function fetchRealApts() {
    const container = document.getElementById('apt-container');
    const cntEl = document.getElementById('results-count');
    const sumEl = document.getElementById('results-summary');

    var typeKo = curType === 'sale' ? '매매' : (curType === 'jeonse' ? '전세' : '월세');
    var sumTxt = curType === 'rent'
      ? ('🔍 ' + curSido + ' ' + curSigungu + ' ' + curDong + ' 보증금 ' + fmt(curRentDeposit) + '/월 ' + curRentMonthly + '만 국토부 실거래')
      : ('🔍 ' + curSido + ' ' + curSigungu + ' ' + curDong + ' ' + fmt(curBudget) + ' 국토부 ' + typeKo);

    if (sumEl) sumEl.textContent = sumTxt;
    if (cntEl) cntEl.textContent = '국토부 실거래 실시간 매칭 중...';

    var dbSido = (curSido === '전남광주통합특별시' || curSido === '광주광역시') ? '광주광역시' : curSido;
    var dongClean = curDong.replace(/동$/, '').trim();

    var url = 'https://dcysjuxyjqtvkihdsjvv.supabase.co/rest/v1/safe_apartments?select=시도,시군구,동리,단지명,세대수,최고층수&limit=30';
    if (dbSido) url += '&시도=in.(' + encodeURIComponent(dbSido) + ',' + encodeURIComponent(curSido) + ')';
    if (curSigungu && curSigungu !== '전체') url += '&시군구=eq.' + encodeURIComponent(curSigungu);
    if (dongClean && dongClean !== '중심가') url += '&동리=ilike.*' + encodeURIComponent(dongClean) + '*';

    try {
      var res = await fetch(url, { headers: { 'apikey': 'sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2' } });
      if (res.ok) {
        var rows = await res.json();
        loadedApts = rows;
      } else {
        loadedApts = [];
      }
    } catch(err) {
      console.error(err);
      loadedApts = [];
    }

    renderCards();
  }

  function populateSigungu(sido) {
    const sigunguSel = document.getElementById('sel-sigungu');
    if (!sigunguSel) return;
    const list = REGIONS[sido] || ['전체'];
    sigunguSel.innerHTML = list.map(function(g) {
      return '<option value="' + g + '" ' + (g === curSigungu ? 'selected' : '') + '>' + g + '</option>';
    }).join('');
    if (!list.includes(curSigungu)) {
      curSigungu = list[0];
      sigunguSel.value = curSigungu;
    }
  }

  function handleSidoChange() {
    curSido = document.getElementById('sel-sido').value;
    populateSigungu(curSido);
    handleSigunguChange();
  }

  function handleSigunguChange() {
    curSigungu = document.getElementById('sel-sigungu').value;
    if (curSigungu === '북구') {
      if (curDong !== '일곡동' && curDong !== '양산동') curDong = '일곡동';
    } else if (curSigungu === '광산구') curDong = '수완동';
    else if (curSigungu === '서구') curDong = '치평동';
    else if (curSigungu === '남구') curDong = '봉선동';
    else if (curSigungu === '동구') curDong = '학동';
    else curDong = curSigungu + ' 중심가';

    const dInput = document.getElementById('target-dong');
    if (dInput) dInput.value = curDong;
    updateDisplayLabels();
    fetchRealApts();
  }

  function handleDongChange() {
    clearTimeout(dongDebounceTimer);
    dongDebounceTimer = setTimeout(function() {
      const dInput = document.getElementById('target-dong');
      curDong = (dInput ? dInput.value : '').trim() || '중심가';
      updateDisplayLabels();
      fetchRealApts();
    }, 250);
  }

  function updateDisplayLabels() {
    const full = curSido + ' ' + curSigungu + ' ' + curDong;
    const el = document.getElementById('region-display-txt');
    if (el) el.textContent = full;
    const hTitle = document.getElementById('header-title');
    if (hTitle) hTitle.textContent = curSido + ' ' + curSigungu + ' - 안심거래 매칭기';
  }

  function switchMode(t) {
    curType = t;
    const hb = document.getElementById('header-box');
    if (hb) hb.className = 'top-header' + (t === 'jeonse' ? ' theme-jeonse' : (t === 'rent' ? ' theme-rent' : ''));
    ['sale', 'jeonse', 'rent'].forEach(function(x) {
      const btn = document.getElementById('tab-' + x);
      if (btn) btn.classList.toggle('active', x === t);
    });

    const lbl = document.getElementById('budget-label-txt');
    const singleBox = document.getElementById('budget-single-box');
    const rentBox = document.getElementById('budget-rent-box');

    if (t === 'sale') {
      if (lbl) lbl.textContent = '희망 매매 예산';
      curBudget = 20000;
      if (singleBox) singleBox.style.display = 'flex';
      if (rentBox) rentBox.style.display = 'none';
      const numInput = document.getElementById('target-budget-num');
      if (numInput) numInput.value = curBudget;
    } else if (t === 'jeonse') {
      if (lbl) lbl.textContent = '희망 전세 보증금';
      curBudget = 15000;
      if (singleBox) singleBox.style.display = 'flex';
      if (rentBox) rentBox.style.display = 'none';
      const numInput = document.getElementById('target-budget-num');
      if (numInput) numInput.value = curBudget;
    } else {
      if (lbl) lbl.textContent = '희망 월세 조건 (보증금 + 월세)';
      if (singleBox) singleBox.style.display = 'none';
      if (rentBox) rentBox.style.display = 'grid';
      const depInput = document.getElementById('target-rent-deposit');
      if (depInput) depInput.value = curRentDeposit;
      const monInput = document.getElementById('target-rent-monthly');
      if (monInput) monInput.value = curRentMonthly;
    }

    updateKorean();
    renderPresets();
    renderCards();
  }

  function handleBudgetNumChange() {
    curBudget = parseFloat(document.getElementById('target-budget-num').value) || 0;
    updateKorean();
    renderPresets();
    renderCards();
  }

  function handleRentChange() {
    curRentDeposit = parseFloat(document.getElementById('target-rent-deposit').value) || 0;
    curRentMonthly = parseFloat(document.getElementById('target-rent-monthly').value) || 0;
    updateKorean();
    renderCards();
  }

  function updateKorean() {
    const el = document.getElementById('budget-korean-txt');
    if (!el) return;
    if (curType === 'rent') {
      el.textContent = '보증금 ' + fmt(curRentDeposit) + ' / 월 ' + curRentMonthly + '만';
    } else {
      el.textContent = fmt(curBudget);
    }
  }

  function selectPreset(val) {
    if (curType === 'rent') {
      curRentDeposit = val.deposit;
      curRentMonthly = val.monthly;
      const depInput = document.getElementById('target-rent-deposit');
      if (depInput) depInput.value = curRentDeposit;
      const monInput = document.getElementById('target-rent-monthly');
      if (monInput) monInput.value = curRentMonthly;
    } else {
      curBudget = val;
      const numInput = document.getElementById('target-budget-num');
      if (numInput) numInput.value = val;
    }
    updateKorean();
    renderPresets();
    renderCards();
  }

  function renderPresets() {
    const box = document.getElementById('preset-container');
    if (!box) return;
    if (curType === 'sale') {
      var presets = [15000, 20000, 25000, 30000, 40000];
      box.innerHTML = presets.map(function(p) {
        return '<button class="preset-btn ' + (p === curBudget ? 'active' : '') + '" onclick="selectPreset(' + p + ')">' + fmt(p) + '</button>';
      }).join('');
    } else if (curType === 'jeonse') {
      var presets = [10000, 15000, 20000, 25000];
      box.innerHTML = presets.map(function(p) {
        return '<button class="preset-btn ' + (p === curBudget ? 'active' : '') + '" onclick="selectPreset(' + p + ')">' + fmt(p) + '</button>';
      }).join('');
    } else {
      var presets = [
        { label: '1천 / 50', deposit: 1000, monthly: 50 },
        { label: '2천 / 65', deposit: 2000, monthly: 65 },
        { label: '3천 / 80', deposit: 3000, monthly: 80 }
      ];
      box.innerHTML = presets.map(function(p) {
        return '<button class="preset-btn ' + (p.deposit === curRentDeposit && p.monthly === curRentMonthly ? 'active' : '') + '" onclick="selectPreset({deposit:' + p.deposit + ',monthly:' + p.monthly + '})">' + p.label + '</button>';
      }).join('');
    }
  }

  function fmt(val) {
    if (val <= 0) return '0원';
    if (val >= 10000) {
      var eok = Math.floor(val / 10000);
      var man = val % 10000;
      return man > 0 ? (eok + '억 ' + man.toLocaleString() + '만 원') : (eok + '억 원');
    }
    return val.toLocaleString() + '만 원';
  }

  function calcSavedFee(price, type, rentDeposit, monthly) {
    if (type === 'sale') {
      var std = 0;
      if (price < 5000) std = Math.min(price * 0.006, 25);
      else if (price < 20000) std = Math.min(price * 0.005, 80);
      else std = Math.round(price * 0.004);
      return Math.round(std / 2);
    } else if (type === 'jeonse') {
      var std = 0;
      if (price < 5000) std = Math.min(price * 0.005, 20);
      else if (price < 10000) std = Math.min(price * 0.004, 30);
      else std = Math.round(price * 0.003);
      return Math.round(std / 2);
    } else {
      var conv = rentDeposit + (monthly * 100);
      if (conv < 5000) conv = rentDeposit + (monthly * 70);
      var std = 0;
      if (conv < 5000) std = Math.min(conv * 0.005, 20);
      else if (conv < 10000) std = Math.min(conv * 0.004, 30);
      else std = Math.round(conv * 0.003);
      return Math.round(std / 2);
    }
  }

  function renderCards() {
    const container = document.getElementById('apt-container');
    const cntEl = document.getElementById('results-count');
    const sumEl = document.getElementById('results-summary');
    if (!container) return;

    var typeKo = curType === 'sale' ? '매매' : (curType === 'jeonse' ? '전세' : '월세');
    var sumTxt = curType === 'rent'
      ? ('🔍 ' + curSido + ' ' + curSigungu + ' ' + curDong + ' 보증금 ' + fmt(curRentDeposit) + '/월 ' + curRentMonthly + '만 국토부 실거래')
      : ('🔍 ' + curSido + ' ' + curSigungu + ' ' + curDong + ' ' + fmt(curBudget) + ' 국토부 ' + typeKo);

    if (sumEl) sumEl.textContent = sumTxt;
    if (cntEl) cntEl.textContent = loadedApts.length + '개 단지 발견';

    if (loadedApts.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:32px 16px; color:#64748b; background:#fff; border-radius:12px; border:1px dashed #cbd5e1;">' +
        '<div style="font-size:22px; margin-bottom:6px;">🔎</div>' +
        '<div style="font-size:14px; font-weight:800; color:#1e293b;">국토교통부 실거래 단지를 조회 중이거나 검색 결과가 없습니다.</div>' +
        '<div style="font-size:12px; color:#94a3b8; margin-top:4px;">동 이름을 입력하시면 0.1초 만에 실시간으로 자동 조회됩니다.</div>' +
        '</div>';
      return;
    }

    container.innerHTML = loadedApts.map(function(apt, idx) {
      var badgeCls = 'badge-sale';
      var benCls = 'benefit-sale';
      var pTxt = '';
      var benTxt = '';
      var name = apt['단지명'] || apt.name || '아파트';
      var dong = apt['동리'] || apt.dong || curDong;
      var hh = apt['세대수'] ? (apt['세대수'] + '세대') : '국토부 등록';
      var fl = apt['최고층수'] ? ('최고 ' + apt['최고층수'] + '층') : '15층';
      var specTxt = hh + ' / ' + fl;

      if (curType === 'sale') {
        badgeCls = 'badge-sale';
        benCls = 'benefit-sale';
        var estPrice = Math.round(curBudget * (0.88 + (idx % 4) * 0.08) / 100) * 100;
        pTxt = '실거래 ' + fmt(estPrice);
        var save = calcSavedFee(estPrice, 'sale');
        benTxt = '<span>중개사 표준 수수료의 절반</span><span class="benefit-save">➔ ' + save + '만 원 절약</span>';
      } else if (curType === 'jeonse') {
        badgeCls = 'badge-jeonse';
        benCls = 'benefit-jeonse';
        var estPrice2 = Math.round(curBudget * (0.85 + (idx % 4) * 0.1) / 100) * 100;
        pTxt = '전세 ' + fmt(estPrice2);
        var save2 = calcSavedFee(estPrice2, 'jeonse');
        benTxt = '<span>🛡️ HUG 126% 보증보험 안전</span><span class="benefit-save">➔ 수수료 ' + save2 + '만 원 절약</span>';
      } else {
        badgeCls = 'badge-rent';
        benCls = 'benefit-rent';
        var dep = curRentDeposit;
        var mon = curRentMonthly + ((idx % 3) * 5);
        pTxt = '보증금 ' + fmt(dep) + ' / 월 ' + mon + '만';
        var save3 = calcSavedFee(0, 'rent', dep, mon);
        benTxt = '<span>🔒 최우선변제 100% 전액보호</span><span class="benefit-save">➔ 수수료 ' + save3 + '만 원 절약</span>';
      }

      var applyUrl = '/request.html?type=' + encodeURIComponent(curType) + '&dong=' + encodeURIComponent(dong) + '&apt=' + encodeURIComponent(name);
      return '<div class="apt-card">' +
        '<div class="apt-name"><span>[' + dong + '] ' + name + '</span><span class="apt-floor">' + specTxt + '</span></div>' +
        '<div class="price-row"><span class="price-badge ' + badgeCls + '">' + pTxt + '</span><span class="price-date">2026.09 국토부 신고</span></div>' +
        '<div class="benefit-box ' + benCls + '">' + benTxt + '</div>' +
        '<a href="' + applyUrl + '" class="apt-apply-btn">🤝 이 아파트 안심거래 신청하기 (수수료 50% 절약) ›</a>' +
        '</div>';
    }).join('');
  }

  function performSearch() {
    fetchRealApts();
    var el = document.getElementById('results-summary');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function shareLink() {
    var u = location.href;
    var t = '전남광주통합특별시 안심거래 매칭기';
    var txt = curSido + ' ' + curSigungu + ' ' + curDong + ' 국토부 실거래 아파트 안심거래 매칭기입니다. 중개사 표준 절반 수수료 혜택도 확인해 보세요.';
    if (navigator.share) {
      navigator.share({ title: t, text: txt, url: u }).catch(function() {});
    } else {
      navigator.clipboard.writeText(u).then(function() {
        alert('안심거래 매칭기 주소가 복사되었습니다! 카카오톡이나 밴드에 붙여넣어 보세요: ' + u);
      }).catch(function() {
        prompt('주소를 복사하세요:', u);
      });
    }
  }

  function init() {
    const sidoSel = document.getElementById('sel-sido');
    if (sidoSel) sidoSel.value = curSido;
    populateSigungu(curSido);
    const sigunguSel = document.getElementById('sel-sigungu');
    if (sigunguSel) sigunguSel.value = curSigungu;
    const dongInput = document.getElementById('target-dong');
    if (dongInput) dongInput.value = curDong;
    updateDisplayLabels();
    switchMode('sale');
    fetchRealApts();
  }

  setTimeout(init, 10);
  // Service Worker & PWA Install
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }

  let aptDeferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    aptDeferredPrompt = e;
  });

  const aptInstallBtn = document.getElementById("aptInstallBtn");
  if (aptInstallBtn) {
    aptInstallBtn.addEventListener("click", async () => {
      if (aptDeferredPrompt) {
        try {
          aptDeferredPrompt.prompt();
          const choice = await aptDeferredPrompt.userChoice;
          if (choice && choice.outcome === "accepted") {
            aptDeferredPrompt = null;
            return;
          }
        } catch (err) {
          console.warn("Install prompt error:", err);
        }
      }
      location.href = "/app-install";
    });
  }
</script>
</body>
</html>

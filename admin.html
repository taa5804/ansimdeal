<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안심딜 본사 관리자 센터</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-white">우리아파트 안심딜 본사 관리자 센터</h1>
        <p class="text-xs text-slate-400 mt-1">자산 매수의뢰 내역 및 회원 중개사 매칭 현황 실시간 관제</p>
      </div>
      <a href="/" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold rounded-xl border border-amber-500/30">메인 서비스 바로가기 ➔</a>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <div class="p-4 rounded-2xl bg-slate-800 border border-slate-700"><span class="text-xs text-slate-400 font-bold">누적 매수의뢰</span><div class="text-2xl font-black text-white mt-1">12건</div></div>
      <div class="p-4 rounded-2xl bg-slate-800 border border-slate-700"><span class="text-xs text-slate-400 font-bold">회원 중개사 (월 3만 원)</span><div class="text-2xl font-black text-amber-400 mt-1">8곳</div></div>
      <div class="p-4 rounded-2xl bg-slate-800 border border-slate-700"><span class="text-xs text-slate-400 font-bold">4대 서류 검증 완료</span><div class="text-2xl font-black text-teal-400 mt-1">15건</div></div>
      <div class="p-4 rounded-2xl bg-slate-800 border border-slate-700"><span class="text-xs text-slate-400 font-bold">이번 달 멤버십 정산</span><div class="text-2xl font-black text-blue-400 mt-1">240,000원</div></div>
    </div>
  </div>
</body>
</html>

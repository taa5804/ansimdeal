<!DOCTYPE html>
<html lang="ko"><head>
<script>
(function() {
  function applyRealFix() {
    // 1. 메인 카드: 전세 -> 대지 매매, 월세 -> 삭제
    var allCards = document.querySelectorAll("a, div, .card");
    allCards.forEach(function(c) {
      if (c.innerText && c.innerText.includes("전세 구하기")) {
        c.innerHTML = c.innerHTML.replace(/전세\s*구하기/g, "신축 대지(垈地) 매매")
                                 .replace(/전세조건\s*등록/g, "대지조건 등록")
                                 .replace(/🔑/g, "🏗️");
      }
      if (c.innerText && c.innerText.includes("월세 구하기")) {
        c.style.setProperty("display", "none", "important");
      }
    });

    // 2. 계산기 탭 버튼: [매매], [전세], [월세]
    var buttons = document.querySelectorAll("button, a, div, li, span");
    buttons.forEach(function(b) {
      if (b.children.length === 0) {
        var txt = b.innerText.trim();
        if (txt === "매매") {
          b.innerText = "🏢 빌딩 · 상가 매매";
        } else if (txt === "전세") {
          b.innerText = "🏗️ 신축 대지 매매";
        } else if (txt === "월세") {
          var parentBtn = b.closest("button") || b.closest("li") || b.closest("a") || b;
          parentBtn.style.setProperty("display", "none", "important");
        }
      }
    });

    // 3. 카드 그리드 3열 -> 2열 균형 조정
    var grids = document.querySelectorAll("[class*='grid-cols-3'], [class*='md:grid-cols-3']");
    grids.forEach(function(g) {
      if (g.innerText.includes("빌딩") || g.innerText.includes("대지")) {
        g.className = g.className.replace("md:grid-cols-3", "md:grid-cols-2").replace("grid-cols-3", "md:grid-cols-2");
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyRealFix);
  } else {
    applyRealFix();
  }
  window.addEventListener("load", applyRealFix);
  setTimeout(applyRealFix, 100);
  setTimeout(applyRealFix, 500);
  setTimeout(applyRealFix, 1500);
})();
</script>

<script>
(function(){

"use strict";


/* =========================
   기본값
========================= */

let currentType =
  "sale";


let calculatedPlatformBase =
  0;


const typeButtons =
  document.querySelectorAll(
    ".type-btn"
  );


const saleFields =
  document.getElementById(
    "saleFields"
  );


const jeonseFields =
  document.getElementById(
    "jeonseFields"
  );


const monthlyFields =
  document.getElementById(
    "monthlyFields"
  );


const result =
  document.getElementById(
    "result"
  );


const normalPrice =
  document.getElementById(
    "normalPrice"
  );


const platformPrice =
  document.getElementById(
    "platformPrice"
  );


const detail =
  document.getElementById(
    "detail"
  );


const calcBtn =
  document.getElementById(
    "calcBtn"
  );


const paymentBtn =
  document.getElementById(
    "paymentBtn"
  );


const normalParty =
  document.getElementById(
    "normalParty"
  );

const platformParty =
  document.getElementById(
    "platformParty"
  );

function updatePartyLabels(){

  const feeOnlyNotice =
    document.getElementById(
      "feeOnlyNotice"
    );

  if(
    currentType ===
    "sale"
  ){
    normalParty.textContent =
      "매도자";

    platformParty.textContent =
      "매수자";

    if(feeOnlyNotice){
      feeOnlyNotice.innerHTML =
        "매수자는 공인중개사 중개수수료를 별도로 지급하지 않습니다.<br>표시된 플랫폼 서비스 이용료만 지급합니다.";
    }
  }
  else{
    normalParty.textContent =
      "임대인";

    platformParty.textContent =
      "임차인";

    if(feeOnlyNotice){
      feeOnlyNotice.innerHTML =
        "임차인은 공인중개사 중개수수료를 별도로 지급하지 않습니다.<br>표시된 플랫폼 서비스 이용료만 지급합니다.";
    }
  }

}


/* =========================
   숫자 처리
========================= */

function numberOnly(value){

  return Number(
    String(value || "")
      .replace(
        /[^0-9]/g,
        ""
      )
  ) || 0;

}


function formatWon(value){

  return Math.round(value)
    .toLocaleString(
      "ko-KR"
    ) +
    "원";

}


function formatInput(input){

  const number =
    numberOnly(
      input.value
    );


  if(!number){

    input.value =
      "";

    return;

  }


  input.value =
    number
      .toLocaleString(
        "ko-KR"
      );

}


/* =========================
   거래유형 선택
========================= */

typeButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        currentType =
          this.dataset.type;


        updatePartyLabels();


        typeButtons.forEach(
          btn => {

            btn
              .classList
              .remove(
                "active"
              );

          }
        );


        this
          .classList
          .add(
            "active"
          );


        saleFields
          .classList
          .add(
            "hidden"
          );


        jeonseFields
          .classList
          .add(
            "hidden"
          );


        monthlyFields
          .classList
          .add(
            "hidden"
          );


        if(
          currentType ===
          "sale"
        ){

          saleFields
            .classList
            .remove(
              "hidden"
            );

        }


        if(
          currentType ===
          "jeonse"
        ){

          jeonseFields
            .classList
            .remove(
              "hidden"
            );

        }


        if(
          currentType ===
          "monthly"
        ){

          monthlyFields
            .classList
            .remove(
              "hidden"
            );

        }


        result
          .classList
          .remove(
            "show"
          );


        paymentBtn.style.display =
          "none";


        calculatedPlatformBase =
          0;

      }
    );

  }
);


/* =========================
   입력금액 콤마
========================= */

document
  .querySelectorAll(
    ".money-box input"
  )
  .forEach(
    input => {

      input.addEventListener(
        "input",
        function(){

          formatInput(
            this
          );

        }
      );

    }
  );


/* =========================
   매매 내부 요율 계산
========================= */

function calculateSaleFee(
  price
){

  let rate =
    0;

  let limit =
    Infinity;


  if(
    price <
    50000000
  ){

    rate =
      0.006;

    limit =
      250000;

  }

  else if(
    price <
    200000000
  ){

    rate =
      0.005;

    limit =
      800000;

  }

  else if(
    price <
    900000000
  ){

    rate =
      0.004;

  }

  else if(
    price <
    1200000000
  ){

    rate =
      0.005;

  }

  else if(
    price <
    1500000000
  ){

    rate =
      0.006;

  }

  else{

    rate =
      0.007;

  }


  return Math.min(
    price * rate,
    limit
  );

}


/* =========================
   전세·월세 내부 요율 계산
========================= */

function calculateRentFee(
  price
){

  let rate =
    0;

  let limit =
    Infinity;


  if(
    price <
    50000000
  ){

    rate =
      0.005;

    limit =
      200000;

  }

  else if(
    price <
    100000000
  ){

    rate =
      0.004;

    limit =
      300000;

  }

  else if(
    price <
    600000000
  ){

    rate =
      0.003;

  }

  else if(
    price <
    1200000000
  ){

    rate =
      0.004;

  }

  else if(
    price <
    1500000000
  ){

    rate =
      0.005;

  }

  else{

    rate =
      0.006;

  }


  return Math.min(
    price * rate,
    limit
  );

}


/* =========================
   이용료 계산
========================= */

calcBtn
  .addEventListener(
    "click",
    function(){

      let transactionPrice =
        0;


      let baseFee =
        0;


      /* =====================
         매매
      ===================== */

      if(
        currentType ===
        "sale"
      ){

        transactionPrice =
          numberOnly(
            document
              .getElementById(
                "salePrice"
              )
              .value
          );


        if(
          !transactionPrice
        ){

          alert(
            "매매금액을 입력해 주세요."
          );

          return;

        }


        baseFee =
          calculateSaleFee(
            transactionPrice
          );

      }


      /* =====================
         전세
      ===================== */

      if(
        currentType ===
        "jeonse"
      ){

        transactionPrice =
          numberOnly(
            document
              .getElementById(
                "jeonsePrice"
              )
              .value
          );


        if(
          !transactionPrice
        ){

          alert(
            "전세보증금을 입력해 주세요."
          );

          return;

        }


        baseFee =
          calculateRentFee(
            transactionPrice
          );

      }


      /* =====================
         월세
      ===================== */

      if(
        currentType ===
        "monthly"
      ){

        const deposit =
          numberOnly(
            document
              .getElementById(
                "monthlyDeposit"
              )
              .value
          );


        const rent =
          numberOnly(
            document
              .getElementById(
                "monthlyRent"
              )
              .value
          );


        if(
          !rent
        ){

          alert(
            "월세를 입력해 주세요."
          );

          return;

        }


        /*
          월세 거래금액
          보증금 + 월세 × 100
        */

        transactionPrice =
          deposit +
          (
            rent *
            100
          );


        /*
          5천만원 미만이면
          월세 × 70 적용
        */

        if(
          transactionPrice <
          50000000
        ){

          transactionPrice =
            deposit +
            (
              rent *
              70
            );

        }


        baseFee =
          calculateRentFee(
            transactionPrice
          );

      }


      /* =====================
         플랫폼 서비스 이용료
         내부 기준 50%
      ===================== */

      calculatedPlatformBase =
        Math.round(
          baseFee *
          0.5
        );


      /*
        요율표 기준 금액
        부가세 포함
      */

      const normalWithVat =
        Math.round(
          baseFee *
          1.1
        );


      /*
        플랫폼 서비스 이용료
        부가세 포함
      */

      const platformWithVat =
        Math.round(
          calculatedPlatformBase *
          1.1
        );


      normalPrice
        .textContent =
        formatWon(
          normalWithVat
        );


      platformPrice
        .textContent =
        formatWon(
          platformWithVat
        );


      detail
        .textContent =
        "표시 금액은 부가가치세를 포함한 예상금액입니다.";


      result
        .classList
        .add(
          "show"
        );


      paymentBtn.style.display =
        "block";


      result
        .scrollIntoView({

          behavior:
            "smooth",

          block:
            "nearest"

        });

    }
  );


/* =========================
   입금확인 페이지 이동
========================= */

paymentBtn
  .addEventListener(
    "click",
    function(){

      if(
        !calculatedPlatformBase
      ){

        alert(
          "먼저 플랫폼 서비스 이용료를 확인해 주세요."
        );

        return;

      }


      /*
        중요:
        VAT 제외 플랫폼 서비스 이용료를 저장합니다.
        service-fee-payment.html에서
        VAT 10%를 한 번만 계산합니다.
      */

      localStorage
        .setItem(
          "wooriapt_service_fee",
          String(
            calculatedPlatformBase
          )
        );


      localStorage
        .setItem(
          "wooriapt_service_type",
          currentType
        );


      location.href =
        "/service-fee-payment.html";

    }
  );


})();
</script>

</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>회원정보 변경 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:14px 12px 50px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.brand{
  color:#173a59;
  font-size:19px;
  font-weight:900;
}

.brand strong{
  color:#1165d7;
}

.back{
  padding:8px 11px;
  border:1px solid #d4dfe7;
  border-radius:10px;
  background:#fff;
  color:#476377;
  font-size:13px;
  font-weight:800;
}

.card{
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:18px;
  padding:22px 16px;
  box-shadow:0 6px 18px rgba(26,61,88,.06);
}

.badge{
  display:inline-block;
  margin-bottom:9px;
  padding:5px 10px;
  border-radius:999px;
  background:#edf2f5;
  color:#476779;
  font-size:12px;
  font-weight:900;
}

h1{
  margin:0 0 7px;
  color:#143b61;
  font-size:27px;
}

.desc{
  margin:0 0 20px;
  color:#697e8e;
  font-size:14px;
  line-height:1.6;
}

.section-title{
  margin:24px 0 14px;
  padding-bottom:9px;
  border-bottom:1px solid #e3eaf0;
  color:#173e60;
  font-size:18px;
  font-weight:900;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#173e60;
  font-size:14px;
  font-weight:900;
}

.required{
  color:#d92d20;
}

input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid #c9d5df;
  border-radius:10px;
  background:#fff;
  color:#173e60;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

input[readonly]{
  background:#f4f7f9;
  color:#6f8190;
}

.help{
  margin-top:6px;
  color:#718391;
  font-size:11px;
  line-height:1.55;
}

.manager-box{
  margin-bottom:20px;
  padding:14px;
  border:1px solid #d8e4ec;
  border-radius:12px;
  background:#f7fafc;
}

.manager-label{
  margin-bottom:5px;
  color:#6d8190;
  font-size:12px;
  font-weight:800;
}

.manager-number{
  color:#1165d7;
  font-size:18px;
  font-weight:900;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:22px;
}

button{
  height:48px;
  border-radius:11px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

.cancel{
  border:1px solid #ccd9e2;
  background:#fff;
  color:#476377;
}

.save{
  border:1px solid #1165d7;
  background:#1165d7;
  color:#fff;
}

.msg{
  display:none;
  margin-top:13px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.5;
}

.msg.ok{
  display:block;
  background:#edf8f1;
  color:#26733e;
}

.msg.error{
  display:block;
  background:#fff1f0;
  color:#c62828;
}

.notice{
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  background:#f5f8fa;
  color:#718391;
  font-size:12px;
  line-height:1.65;
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#83939e;
  font-size:11px;
}

@media(max-width:430px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .card{
    padding:19px 13px;
  }

  h1{
    font-size:24px;
  }

  .buttons{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <a class="brand" href="/">
    🏠 우리아파트 <strong>안심거래</strong>
  </a>

  <a
    class="back"
    href="/broker-dashboard.html">
    공인중개사 업무
  </a>

</header>


<main class="card">

  <span class="badge">
    공인중개사 회원정보
  </span>

  <h1>
    회원정보 변경
  </h1>

  <p class="desc">
    등록된 공인중개사 정보를 확인하고 수정합니다.
  </p>


  <!-- 중개사 관리번호 -->

  <div class="manager-box">

    <div class="manager-label">
      중개사 관리번호
    </div>

    <div
      id="managerNumber"
      class="manager-number">
      거래완료 후 자동 부여
    </div>

  </div>


  <!-- 대표자 -->

  <h2 class="section-title">
    기본정보
  </h2>


  <div class="field">

    <label>
      대표자명 <span class="required">*</span>
    </label>

    <input
      id="representative"
      type="text"
      placeholder="대표자명">

  </div>


  <div class="field">

    <label>
      휴대전화번호 <span class="required">*</span>
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="11"
      placeholder="휴대전화번호">

    <div class="help">
      휴대전화번호는 로그인 기준으로 사용됩니다.
      별도의 비밀번호는 사용하지 않습니다.
    </div>

  </div>


  <!-- 사무소 -->

  <h2 class="section-title">
    중개사무소 정보
  </h2>


  <div class="field">

    <label>
      중개사무소명 <span class="required">*</span>
    </label>

    <input
      id="officeName"
      type="text"
      placeholder="중개사무소명">

  </div>


  <div class="field">

    <label>
      사무소 전화번호 <span class="required">*</span>
    </label>

    <input
      id="officePhone"
      type="tel"
      inputmode="tel"
      maxlength="13"
      placeholder="사무소 전화번호">

  </div>


  <div class="field">

    <label>
      사업자등록번호 <span class="required">*</span>
    </label>

    <input
      id="businessNumber"
      type="text"
      inputmode="numeric"
      maxlength="12"
      placeholder="사업자등록번호">

  </div>


  <div class="field">

    <label>
      개업공인중개사 등록번호 <span class="required">*</span>
    </label>

    <input
      id="brokerNumber"
      type="text"
      placeholder="개업공인중개사 등록번호">

  </div>


  <div class="field">

    <label>
      사무소 주소 <span class="required">*</span>
    </label>

    <input
      id="officeAddress"
      type="text"
      placeholder="사무소 주소">

  </div>


  <div class="field">

    <label>
      상세주소
    </label>

    <input
      id="officeAddressDetail"
      type="text"
      placeholder="상세주소">

  </div>


  <!-- 세금계산서 -->

  <h2 class="section-title">
    세금계산서 정보
  </h2>


  <div class="field">

    <label>
      세금계산서 발급 이메일 <span class="required">*</span>
    </label>

    <input
      id="email"
      type="email"
      placeholder="세금계산서를 받을 이메일">

  </div>


  <div class="buttons">

    <button
      class="cancel"
      type="button"
      onclick="location.href='/broker-dashboard.html'">
      취소
    </button>

    <button
      id="saveBtn"
      class="save"
      type="button">
      저장
    </button>

  </div>


  <div
    id="msg"
    class="msg">
  </div>


  <div class="notice">

    중개사 관리번호는 회원가입 때 입력하지 않습니다.<br>
    첫 거래가 최종 완료되면 플랫폼에서 자동으로 부여됩니다.<br>
    회원정보를 변경해도 기존 거래정보와 거래번호는 변경되지 않습니다.

  </div>

</main>


<footer class="footer">
  © 우리아파트 안심거래
</footer>

</div>


<script>

"use strict";


const fields = {

  representative:
    document.getElementById("representative"),

  phone:
    document.getElementById("phone"),

  officeName:
    document.getElementById("officeName"),

  officePhone:
    document.getElementById("officePhone"),

  businessNumber:
    document.getElementById("businessNumber"),

  brokerNumber:
    document.getElementById("brokerNumber"),

  officeAddress:
    document.getElementById("officeAddress"),

  officeAddressDetail:
    document.getElementById("officeAddressDetail"),

  email:
    document.getElementById("email")

};


const saveBtn =
  document.getElementById("saveBtn");

const msg =
  document.getElementById("msg");


/* 휴대전화 숫자 */

fields.phone.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/\D/g,"")
      .slice(0,11);

  }
);


/* 사무소 전화 */

fields.officePhone.addEventListener(
  "input",
  function(){

    let v =
      this.value
      .replace(/\D/g,"")
      .slice(0,11);

    if(v.length<=3){

      this.value=v;

    }else if(v.length<=7){

      this.value =
        v.slice(0,3)+"-"+
        v.slice(3);

    }else{

      this.value =
        v.slice(0,3)+"-"+
        v.slice(3,7)+"-"+
        v.slice(7);

    }

  }
);


/* 사업자번호 */

fields.businessNumber.addEventListener(
  "input",
  function(){

    let v =
      this.value
      .replace(/\D/g,"")
      .slice(0,10);

    if(v.length<=3){

      this.value=v;

    }else if(v.length<=5){

      this.value =
        v.slice(0,3)+"-"+
        v.slice(3);

    }else{

      this.value =
        v.slice(0,3)+"-"+
        v.slice(3,5)+"-"+
        v.slice(5);

    }

  }
);


/* 저장 */

saveBtn.addEventListener(
  "click",
  function(){

    const required = [

      fields.representative,
      fields.phone,
      fields.officeName,
      fields.officePhone,
      fields.businessNumber,
      fields.brokerNumber,
      fields.officeAddress,
      fields.email

    ];


    for(
      const input of required
    ){

      if(!input.value.trim()){

        showMsg(
          "필수 항목을 모두 입력해 주세요.",
          false
        );

        input.focus();

        return;

      }

    }


    const profile = {

      representative:
        fields.representative.value.trim(),

      phone:
        fields.phone.value.trim(),

      officeName:
        fields.officeName.value.trim(),

      officePhone:
        fields.officePhone.value.trim(),

      businessNumber:
        fields.businessNumber.value.trim(),

      brokerNumber:
        fields.brokerNumber.value.trim(),

      officeAddress:
        fields.officeAddress.value.trim(),

      officeAddressDetail:
        fields.officeAddressDetail.value.trim(),

      email:
        fields.email.value.trim(),

      updatedAt:
        new Date().toISOString()

    };


    /*
      실제 운영 시 Supabase
      agent_members 테이블 업데이트로 연결합니다.
    */

    localStorage.setItem(
      "wooriapt_broker_profile",
      JSON.stringify(profile)
    );


    showMsg(
      "회원정보가 저장되었습니다.",
      true
    );

  }
);


/* 저장된 정보 불러오기 */

(function loadProfile(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "wooriapt_broker_profile"
        ) || "null"
      );


    if(!saved){
      return;
    }


    Object.keys(fields).forEach(
      function(key){

        if(
          saved[key] !== undefined
        ){

          fields[key].value =
            saved[key];

        }

      }
    );

  }catch(e){

    console.log(
      "회원정보 불러오기 오류",
      e
    );

  }

})();


/* 중개사 관리번호 */

const managerNumber =
  localStorage.getItem(
    "wooriapt_broker_manager_number"
  );


if(managerNumber){

  document.getElementById(
    "managerNumber"
  ).textContent =
    managerNumber;

}


/* 메시지 */

function showMsg(
  text,
  ok
){

  msg.textContent =
    text;

  msg.className =
    "msg "+
    (ok ? "ok" : "error");

}

</script>

</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앱 설치</title><link rel="stylesheet" href="/assets/style.css"></head><body><header><div class="wrap head"><a class="logo" href="/">우리아파트 <em>안심거래</em></a><a class="back" href="/">← 메인화면</a></div></header><section class="section"><div class="wrap"><div class="box" style="text-align:center"><img src="/assets/icon-192.png" style="width:110px;border-radius:24px"><h1>우리아파트 안심거래 앱</h1><p class="intro">홈 화면에 추가하면 앱처럼 빠르게 이용할 수 있습니다.</p><button class="btn" id="install" style="display:none">앱 설치</button><div class="highlight">설치 버튼이 보이지 않으면 브라우저 메뉴에서 ‘홈 화면에 추가’ 또는 ‘앱 설치’를 선택하세요.</div></div></div></section><script>let p;addEventListener("beforeinstallprompt",e=>{e.preventDefault();p=e;install.style.display="inline-block"});install.onclick=async()=>{if(p){p.prompt();await p.userChoice;p=null}}</script></body></html>

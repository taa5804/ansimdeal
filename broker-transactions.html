<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>거래 진행현황 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

.wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:14px 12px 55px;
}

/* 상단 */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.brand{
  font-size:19px;
  font-weight:900;
  color:#173a59;
}

.brand strong{
  color:#1165d7;
}

.back{
  border:1px solid #d4dfe7;
  background:#fff;
  border-radius:10px;
  padding:8px 11px;
  font-size:13px;
  font-weight:800;
  color:#476377;
}

/* 제목 */

.hero{
  background:#12394d;
  color:#fff;
  border-radius:17px;
  padding:19px 17px;
  margin-bottom:14px;
}

.hero .badge{
  display:inline-block;
  background:rgba(255,255,255,.15);
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:900;
  margin-bottom:8px;
}

.hero h1{
  margin:0;
  font-size:23px;
}

.hero p{
  margin:7px 0 0;
  font-size:13px;
  line-height:1.6;
  opacity:.9;
}

/* 거래유형 */

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.tab{
  min-height:47px;
  border:1px solid #d4dfe7;
  background:#fff;
  border-radius:11px;
  font-weight:900;
  color:#506978;
  cursor:pointer;
}

.tab.active{
  background:#1165d7;
  border-color:#1165d7;
  color:#fff;
}

/* 카드 */

.card{
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.card h2{
  margin:0 0 13px;
  font-size:18px;
}

.guide{
  background:#eef6ff;
  border:1px solid #c9dfff;
  color:#284f74;
  border-radius:12px;
  padding:12px;
  margin-bottom:14px;
  font-size:13px;
  line-height:1.6;
}

/* 입력 */

.field{
  margin-bottom:12px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:800;
}

input{
  width:100%;
  min-height:45px;
  border:1px solid #cbd7df;
  border-radius:10px;
  padding:10px 11px;
  outline:none;
}

input:focus{
  border-color:#1165d7;
}

/* 진행 거래 */

.transaction{
  border:1px solid #dde6ec;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.transaction-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}

.transaction-title{
  font-size:16px;
  font-weight:900;
  color:#173e60;
}

.transaction-type{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:999px;
  background:#eaf4ff;
  color:#1165d7;
  font-size:11px;
  font-weight:900;
}

.status{
  flex:0 0 auto;
  padding:5px 8px;
  border-radius:999px;
  background:#fff4e5;
  color:#a56300;
  font-size:11px;
  font-weight:900;
}

.info{
  display:grid;
  grid-template-columns:95px 1fr;
  gap:7px;
  font-size:13px;
  line-height:1.5;
  margin-bottom:13px;
}

.info strong{
  color:#536b79;
}

.btn{
  width:100%;
  min-height:47px;
  border:0;
  border-radius:11px;
  font-weight:900;
  cursor:pointer;
}

.btn-primary{
  background:#1165d7;
  color:#fff;
}

.btn-dark{
  background:#12394d;
  color:#fff;
}

.empty{
  padding:30px 12px;
  text-align:center;
  color:#758893;
  font-size:13px;
  line-height:1.7;
}

.footer{
  margin-top:18px;
  text-align:center;
  font-size:11px;
  color:#8899a3;
}

@media(max-width:540px){

  .brand{
    font-size:16px;
  }

  .hero h1{
    font-size:21px;
  }

  .tab{
    font-size:14px;
  }

  .info{
    grid-template-columns:80px 1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <header class="header">

    <a
      class="brand"
      href="/broker-dashboard.html">

      🏠 우리아파트
      <strong>안심거래</strong>

    </a>

    <a
      class="back"
      href="/broker-dashboard.html">

      관리자 홈

    </a>

  </header>


  <section class="hero">

    <span class="badge">
      공인중개사 전용
    </span>

    <h1>
      거래 진행현황
    </h1>

    <p>
      고객이 제안을 선택한 거래를 확인하고
      서류 준비와 전자계약을 진행합니다.
    </p>

  </section>


  <!-- 매매 / 전세 / 월세 -->

  <div class="tabs">

    <button
      class="tab active"
      data-type="sale">
      매매
    </button>

    <button
      class="tab"
      data-type="jeonse">
      전세
    </button>

    <button
      class="tab"
      data-type="monthly">
      월세
    </button>

  </div>


  <!-- 테스트 및 거래 진입 -->

  <section class="card">

    <h2 id="roomTitle">
      매매 거래
    </h2>

    <div class="guide" id="roomGuide">
      매수자가 공인중개사의 제안을 선택하면
      해당 거래가 이곳에 자동으로 생성됩니다.
    </div>


    <div class="field">

      <label>
        거래번호
      </label>

      <input
        id="tradeId"
        placeholder="예: T202608270001">

    </div>


    <button
      id="openContractBtn"
      class="btn btn-primary">

      전자계약 관리 열기

    </button>

  </section>


  <!-- 진행 중 거래 -->

  <section class="card">

    <h2>
      진행 중 거래
    </h2>

    <div id="transactionList">

      <div class="empty">

        아직 등록된 거래가 없습니다.

        <br>

        고객이 제안을 선택하면
        해당 거래가 이 화면에 자동으로 표시되도록
        연결할 예정입니다.

      </div>

    </div>

  </section>


  <div class="footer">
    © 우리아파트 안심거래
  </div>

</div>


<script>

(function(){

"use strict";


const $ =
  id =>
  document.getElementById(id);


let currentType =
  "sale";


const TYPE = {

  sale:{
    name:"매매",
    title:"매매 거래",
    guide:
      "매수자가 공인중개사의 매물 제안을 선택하면 해당 매매 거래가 이곳에 자동 생성됩니다."
  },

  jeonse:{
    name:"전세",
    title:"전세 거래",
    guide:
      "임차인이 공인중개사의 전세 제안을 선택하면 해당 전세 거래가 이곳에 자동 생성됩니다."
  },

  monthly:{
    name:"월세",
    title:"월세 거래",
    guide:
      "임차인이 공인중개사의 월세 제안을 선택하면 해당 월세 거래가 이곳에 자동 생성됩니다."
  }

};



function renderType(){

  const data =
    TYPE[currentType];


  $("roomTitle").textContent =
    data.title;


  $("roomGuide").textContent =
    data.guide;


  $("tradeId").value =
    "";

}



document
.querySelectorAll(".tab")
.forEach(function(tab){

  tab.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".tab")
      .forEach(function(btn){

        btn.classList.remove(
          "active"
        );

      });


      this.classList.add(
        "active"
      );


      currentType =
        this.dataset.type;


      renderType();

    }
  );

});



$("openContractBtn")
.addEventListener(
  "click",
  function(){

    const tradeId =
      $("tradeId")
      .value
      .trim();


    if(!tradeId){

      alert(
        "거래번호를 입력해 주세요."
      );

      $("tradeId").focus();

      return;

    }


    location.href =
      "/electronic-contract.html" +
      "?type=" +
      encodeURIComponent(
        currentType
      ) +
      "&trade=" +
      encodeURIComponent(
        tradeId
      );

  }
);



renderType();

})();
</script>

</body>
</html>

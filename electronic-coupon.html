<body>

<div id="electronicCouponApp">

  <h2>분양 전자쿠폰</h2>
  <p>입주예정자·입주민 전자쿠폰을 조회하고 사용할 수 있습니다.</p>

  <div>
    <label for="couponCode">쿠폰번호</label>
    <input
      type="text"
      id="couponCode"
      placeholder="쿠폰번호를 입력하세요"
    >
    <button type="button" id="couponSearch">
      쿠폰 조회
    </button>
  </div>

  <div id="couponResult">
    조회된 쿠폰이 없습니다.
  </div>

</div>

<script>
const searchBtn=document.getElementById("couponSearch");
const codeInput=document.getElementById("couponCode");
const result=document.getElementById("couponResult");

searchBtn.addEventListener("click",function(){

  const code=codeInput.value.trim();

  if(!code){
    alert("쿠폰번호를 입력해주세요.");
    return;
  }

  result.textContent="쿠폰번호 "+code+" 조회 중입니다.";
});
</script>

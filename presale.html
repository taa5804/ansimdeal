<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아파트분양">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>우리 아파트 분양</title>
<style>
#saleMain,
#saleMain *{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}
body{
  overflow-x:hidden;
  background:#eef8fc;
}
button,input,select,textarea{
  font:inherit;
}

#saleMain.sale-main{
  width:min(100%,760px);
  max-width:760px;
  margin:0 auto;
  padding:22px 14px 50px;
  background:#eef8fc;
  color:#14212b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

#saleMain .main-head{
  padding:28px 22px;
  background:#123c52;
  border-radius:20px;
  color:#fff;
}

#saleMain .eyebrow{
  display:inline-block;
  margin-bottom:8px;
  padding:5px 11px;
  border-radius:999px;
  background:rgba(214,173,85,.18);
  border:1px solid rgba(214,173,85,.45);
  color:#f0c568;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
}

#saleMain .main-head h1{
  margin:0 0 8px;
  font-size:clamp(24px,4.2vw,28px);
}

#saleMain .main-head p{
  margin:0;
  font-size:14px;
  line-height:1.6;
  color:#d8e8ef;
}

#saleMain .filter-box{
  display:flex;
  gap:7px;
  margin:16px 0;
  padding:10px;
  background:#fff;
  border-radius:15px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}

#saleMain .filter{
  flex:none;
  padding:10px 15px;
  border:0;
  border-radius:10px;
  background:#edf3f6;
  color:#50606b;
  font-weight:700;
  cursor:pointer;
}

#saleMain .filter.active{
  background:#123c52;
  color:#fff;
}

#saleMain .project-list{
  display:grid;
  gap:18px;
}

#saleMain .project-card{
  overflow:hidden;
  background:#fff;
  border-radius:20px;
  box-shadow:0 8px 24px rgba(25,55,70,.09);
}

#saleMain .project-image{
  position:relative;
  height:clamp(240px,43vw,330px);
  background:linear-gradient(150deg,#a9d1dc,#527b8d) center/cover no-repeat;
  overflow:hidden;
}

#saleMain .image-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.05),
    rgba(0,0,0,.05) 45%,
    rgba(0,0,0,.68)
  );
}

#saleMain .card-top{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#saleMain .status{
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  background:#ee9d19;
  color:#fff;
}

#saleMain .status.upcoming{
  background:#d5ad59;
  color:#162532;
}

#saleMain .project-title{
  position:absolute;
  left:20px;
  right:20px;
  bottom:22px;
  color:#fff;
}

#saleMain .project-title small{
  color:#f0c568;
  font-weight:800;
  letter-spacing:1.4px;
}

#saleMain .project-title h2{
  margin:8px 0 5px;
  font-size:clamp(22px,4vw,26px);
}

#saleMain .project-title p{
  margin:0;
  font-size:14px;
  color:rgba(255,255,255,.9);
}

#saleMain .project-info{
  padding:18px;
}

#saleMain .info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

#saleMain .info-grid div{
  padding:14px;
  background:#f1f8fb;
  border-radius:13px;
}

#saleMain .info-grid span{
  display:block;
  margin-bottom:6px;
  color:#71818b;
  font-size:12px;
}

#saleMain .info-grid strong{
  font-size:15px;
}

#saleMain .detail-btn{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:0;
  border-radius:13px;
  background:#118984;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

#saleMain .detail-btn.disabled{
  background:#bbc6ca;
  cursor:default;
}

#saleMain .area-empty{
  display:none;
  margin:14px 0 18px;
  padding:28px 16px;
  border:1px solid #dfe5ea;
  border-radius:14px;
  background:#fff;
  color:#71808d;
  font-size:14px;
  font-weight:700;
  text-align:center;
  line-height:1.6;
  word-break:keep-all;
}

@media(max-width:640px){
  #saleMain.sale-main{
    padding:12px 10px 35px;
  }
  #saleMain .main-head{
    padding:22px 18px;
    border-radius:16px;
  }
  #saleMain .project-card{
    border-radius:16px;
  }
  #saleMain .project-info{
    padding:14px;
  }
  #saleMain .info-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  #saleMain .info-grid div{
    min-width:0;
    padding:12px 10px;
  }
  #saleMain .detail-btn{
    min-height:50px;
  }
}

@media(max-width:380px){
  #saleMain .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<div id="saleMain" class="sale-main">

  <header class="main-head">
    <span class="eyebrow" id="mainEyebrow">PREMIUM HOUSING</span>
    <h1 id="mainHeaderTitle">우리 아파트 분양</h1>
    <p id="mainHeaderDesc">관심 지역의 분양 정보를 고급 모바일 카탈로그로 확인하세요.</p>
  </header>

  <section class="filter-box" id="filterBox">
    <button type="button" class="filter active" data-area="all">전체</button>
    <button type="button" class="filter" data-area="seoul">서울특별시</button>
    <button type="button" class="filter" data-area="gyeonggi">경기도</button>
    <button type="button" class="filter" data-area="incheon">인천광역시</button>
    <button type="button" class="filter" data-area="busan">부산광역시</button>
    <button type="button" class="filter" data-area="daegu">대구광역시</button>
    <button type="button" class="filter" data-area="daejeon">대전광역시</button>
    <button type="button" class="filter" data-area="ulsan">울산광역시</button>
    <button type="button" class="filter" data-area="sejong">세종특별자치시</button>
    <button type="button" class="filter" data-area="gangwon">강원특별자치도</button>
    <button type="button" class="filter" data-area="chungbuk">충청북도</button>
    <button type="button" class="filter" data-area="chungnam">충청남도</button>
    <button type="button" class="filter" data-area="jeonbuk">전북특별자치도</button>
    <button type="button" class="filter" data-area="jg">전남광주통합특별시</button>
    <button type="button" class="filter" data-area="gyeongbuk">경상북도</button>
    <button type="button" class="filter" data-area="gyeongnam">경상남도</button>
    <button type="button" class="filter" data-area="jeju">제주특별자치도</button>
  </section>

  <section class="project-list" id="projectList"></section>

  <div id="areaEmpty" class="area-empty">
    현재 선택한 지역에 등록된 분양단지가 없습니다.
  </div>

</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "wooriapt_replicated_rooms_v2";
  var allRooms = [];
  var activeRoomCode = "";
  var currentAreaFilter = "all";

  var SIDO_ORDER = [
    "seoul",
    "gyeonggi",
    "incheon",
    "busan",
    "daegu",
    "daejeon",
    "ulsan",
    "sejong",
    "gangwon",
    "chungbuk",
    "chungnam",
    "jeonbuk",
    "jg",
    "gyeongbuk",
    "gyeongnam",
    "jeju"
  ];

  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function sortRoomsByStandardOrder(list) {
    return (Array.isArray(list) ? list.slice() : []).sort(function(a, b) {
      var sa = (a.catalog_data && a.catalog_data.sido) || "seoul";
      var sb = (b.catalog_data && b.catalog_data.sido) || "seoul";
      var ia = SIDO_ORDER.indexOf(sa);
      var ib = SIDO_ORDER.indexOf(sb);
      var oa = ia === -1 ? 999 : ia;
      var ob = ib === -1 ? 999 : ib;
      if (oa !== ob) return oa - ob;
      return String(a.project_code || "").localeCompare(String(b.project_code || ""));
    });
  }

  function getDefaultRooms() {
    return [
      {
        project_code: "ROOM-001",
        project_name: "더 퍼스트 센트럴파크",
        sale_status: "분양 중",
        area: "서울특별시 강남구 역삼동",
        move_in_date: "2029년 8월",
        contact_phone: "02-1588-0001",
        modelhouse_address: "서울특별시 강남구 역삼동 모델하우스",
        catalog_data: {
          channelType: "daangn",
          companyName: "더 퍼스트 분양사업단",
          sido: "seoul",
          households: "1,520세대",
          types: "84A · 84B",
          rewardAmount: 3000,
          coverEyebrow: "PREMIUM RESIDENCE",
          coverDescription: "일상이 작품이 되는 새로운 주거의 시작"
        }
      },
      {
        project_code: "ROOM-002",
        project_name: "판교 레이크뷰 프레스티지",
        sale_status: "분양 중",
        area: "경기도 성남시 분당구",
        move_in_date: "2030년 1월",
        contact_phone: "031-1588-0002",
        modelhouse_address: "경기도 성남시 분당구 판교역로 모델하우스",
        catalog_data: {
          channelType: "daangn",
          companyName: "레이크뷰 분양본부",
          sido: "gyeonggi",
          households: "1,180세대",
          types: "74 · 84 · 101",
          rewardAmount: 3000,
          coverEyebrow: "NEW LIFESTYLE",
          coverDescription: "교통·교육·생활·자연을 가까이 누리는 특별한 자리"
        }
      },
      {
        project_code: "ROOM-003",
        project_name: "양산택지지구 프리미엄 대단지",
        sale_status: "분양 중",
        area: "광주광역시 광산구 하남산단8번로 176",
        move_in_date: "2029년 3월",
        contact_phone: "062-952-4150",
        modelhouse_address: "광주광역시 광산구 하남산단8번로 176",
        catalog_data: {
          channelType: "mart",
          companyName: "양산택지지구 분양사업단",
          sido: "jg",
          households: "1,520세대",
          types: "84A · 84B",
          rewardAmount: 5000,
          partnerName: "에너젠마트",
          coverEyebrow: "PREMIUM RESIDENCE",
          coverDescription: "자연과 건축이 어우러진 프리미엄 대단지"
        }
      }
    ];
  }

  /* 상단 헤더에만 본사관리자 설정 금액 및 채널(모바일 바코드카드 vs 전자쿠폰) 노출 */
  function updateTopHeader(displayRooms) {
    var eyebrowEl = document.getElementById("mainEyebrow");
    var descEl = document.getElementById("mainHeaderDesc");
    if (!eyebrowEl || !descEl) return;

    var targetRoom = null;
    if (activeRoomCode) {
      targetRoom = allRooms.find(function(r) {
        return String(r.project_code || "").toUpperCase() === activeRoomCode;
      });
    }
    if (!targetRoom && displayRooms && displayRooms.length > 0) {
      /* 가장 최근에 본사관리자에서 수정한 방의 설정을 우선 반영 */
      var sortedByUpdate = displayRooms.slice().sort(function(a, b) {
        return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
      });
      targetRoom = sortedByUpdate[0] || displayRooms[0];
    }

    var sysSettings = null;
    try {
      sysSettings = JSON.parse(localStorage.getItem("presaleSystemSettings") || "null");
    } catch (e) {}

    var c = (targetRoom && targetRoom.catalog_data) ? targetRoom.catalog_data : {};
    var rawAmount = Number(c.rewardAmount || (sysSettings && sysSettings.pointAmount) || 3000);
    var amountFormatted = rawAmount.toLocaleString("ko-KR") + "원";
    var isMart = c.channelType === "mart";
    var rewardTypeLabel = isMart ? "전자쿠폰" : "모바일 바코드카드";

    eyebrowEl.textContent = "카탈로그 확인 시 " + amountFormatted + " " + rewardTypeLabel + " 지급";
    descEl.innerHTML =
      "관심 지역의 분양 정보를 고급 모바일 카탈로그로 확인하세요. (유효 확인 완료 시 <strong>" +
      escapeHtml(amountFormatted + " " + rewardTypeLabel) +
      "</strong> 제공)";
  }

  function sanitizeSubtitle(desc) {
    var s = String(desc || "").trim();
    if (!s || s.indexOf("바코드카드") !== -1 || s.indexOf("전자쿠폰") !== -1 || s.indexOf("쿠폰") !== -1) {
      return "일상이 작품이 되는 새로운 주거의 시작";
    }
    return s;
  }

  function renderProjectList() {
    var listEl = document.getElementById("projectList");
    var emptyEl = document.getElementById("areaEmpty");
    if (!listEl) return;

    var displayRooms = sortRoomsByStandardOrder(allRooms);

    if (activeRoomCode) {
      var matched = displayRooms.filter(function(r) {
        return String(r.project_code || "").toUpperCase() === activeRoomCode;
      });
      if (matched.length > 0) {
        displayRooms = matched;
      }
    } else if (currentAreaFilter !== "all") {
      displayRooms = displayRooms.filter(function(r) {
        var c = r.catalog_data || {};
        return (c.sido || "seoul") === currentAreaFilter;
      });
    }

    updateTopHeader(displayRooms);

    if (displayRooms.length === 0) {
      listEl.innerHTML = "";
      if (emptyEl) emptyEl.style.display = "block";
      return;
    }

    if (emptyEl) emptyEl.style.display = "none";

    listEl.innerHTML = displayRooms.map(function(r, idx) {
      var c = r.catalog_data || {};
      var code = r.project_code || "ROOM-001";
      var imgUrl = c.coverImageUrl || "";
      var detailUrl = "/sale-detail.html?room=" + encodeURIComponent(code);
      var statusText = r.sale_status || "분양 중";
      var isUpcoming = statusText.indexOf("예정") !== -1;
      var bgStyle = imgUrl
        ? "background-image:url('" + escapeHtml(imgUrl) + "')"
        : (idx % 2 === 1 ? "background:linear-gradient(150deg,#b4d7ca,#547f73)" : "");

      return `
        <article class="project-card" data-area="${escapeHtml(c.sido || 'seoul')}">
          <div class="project-image" style="${bgStyle}">
            <div class="image-shade"></div>

            <div class="card-top">
              <span class="status ${isUpcoming ? 'upcoming' : ''}">${escapeHtml(statusText)}</span>
            </div>

            <div class="project-title">
              <small>${escapeHtml(c.coverEyebrow || 'PREMIUM RESIDENCE')}</small>
              <h2>${escapeHtml(r.project_name || '단지명을 입력해 주세요')}</h2>
              <p>${escapeHtml(sanitizeSubtitle(c.coverDescription))}</p>
            </div>
          </div>

          <div class="project-info">
            <div class="info-grid">
              <div>
                <span>총 세대수</span>
                <strong>${escapeHtml(c.households || '1,520세대')}</strong>
              </div>

              <div>
                <span>입주 예정</span>
                <strong>${escapeHtml(r.move_in_date || '2030년 1월')}</strong>
              </div>

              <div>
                <span>주요 평형</span>
                <strong>${escapeHtml(c.types || '84A · 84B')}</strong>
              </div>

              <div>
                <span>분양 상태</span>
                <strong>${escapeHtml(statusText)}</strong>
              </div>
            </div>

            <button type="button"
                    class="detail-btn"
                    data-link="${escapeHtml(detailUrl)}">
              분양 카탈로그 보기
            </button>
          </div>
        </article>
      `;
    }).join("");
  }

  async function initSaleMain() {
    var root = document.getElementById("saleMain");
    if (!root) return;

    var params = new URLSearchParams(window.location.search);
    activeRoomCode = (params.get("room") || params.get("code") || "").trim().toUpperCase();

    try {
      var apiOrigin = window.location.hostname.includes("wooriaptcd.com") ? "" : "https://wooriaptcd.com";
      var res = await fetch(apiOrigin + "/api/sale-save");
      var data = await res.json();
      if (res.ok && data.ok && Array.isArray(data.rooms) && data.rooms.length > 0) {
        allRooms = sortRoomsByStandardOrder(data.rooms);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(allRooms));
        } catch (e) {}
      }
    } catch (e) {}

    if (allRooms.length === 0) {
      try {
        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(saved) && saved.length > 0) {
          allRooms = sortRoomsByStandardOrder(saved);
        }
      } catch (e) {}
    }

    if (allRooms.length === 0) {
      allRooms = sortRoomsByStandardOrder(getDefaultRooms());
    }

    renderProjectList();

    root.onclick = function(e) {
      var target = e.target;
      while (target && target !== root) {
        if (target.classList && target.classList.contains("filter")) {
          var filters = root.querySelectorAll(".filter");
          for (var i = 0; i < filters.length; i++) {
            filters[i].classList.remove("active");
          }
          target.classList.add("active");
          currentAreaFilter = target.getAttribute("data-area") || "all";
          renderProjectList();
          return;
        }

        if (target.classList && target.classList.contains("detail-btn") && target.getAttribute("data-link")) {
          var link = target.getAttribute("data-link");
          if (link) {
            window.location.href = link;
          }
          return;
        }
        target = target.parentElement;
      }
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSaleMain);
  } else {
    initSaleMain();
  }
})();
</script>
</body>
</html>

.field-group.full{

}

}

  border-radius:10px;
  overflow:hidden;
}

.result-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:58px;
  padding:12px 14px;
  border-bottom:1px dashed #d8e0e7;

.result-line:last-child{

.result-label{

  font-size:14px;
  line-height:1.5;
  font-weight:800;

.result-value{

  font-size:18px;
  font-weight:900;

.result-card.buyer .main-value{

}

.result-card.seller .main-value{
  color:#24953d;
}

.result-total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 14px 14px;
  padding:14px;
  border-radius:10px;
  font-weight:900;
}

.result-card.buyer .result-total{
  background:#e9f4ff;
  color:#1165d7;
}

.result-card.seller .result-total{
  background:#eaf8e7;
  color:#23853b;
}

.result-total strong{
  font-size:21px;

.bottom-notice{
  display:flex;
  gap:12px;
  margin-top:22px;
  padding:18px;
  border:1px solid #f2d18a;
  border-radius:14px;
  background:#fff9ec;
}

.warning-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f7b928;
  color:#fff;
  font-size:20px;
  font-weight:900;
}

.bottom-notice-text{
  color:#4a4333;
  font-size:14px;
  line-height:1.9;
  font-weight:700;
}


/* =========================================
   모바일
========================================= */

@media(max-width:700px){

  .detail-wrap{
    padding:12px 10px 40px;
  }

  .detail-card{
    padding:18px 14px;
    border-radius:14px;
  }

  .fee-page{
    margin:-18px -14px;
    padding:20px 14px;
  }

  .fee-title{
    font-size:28px;
  }

  .info-row{
    grid-template-columns:1fr;
  }

  .fee-small-notice{
    display:block;
  }

  .fee-small-notice div{
    margin-top:6px;
  }

  .field-grid{
    grid-template-columns:1fr;
  }

  .field-group.full{
    grid-column:auto;
  }

  .result-grid{
    grid-template-columns:1fr;
  }

  .calc-tab{
    height:48px;
    font-size:15px;
  }

  .result-line{
    padding:11px;
  }

  .result-value{
    font-size:16px;
  }

}

</p>


<div class="info-row">

<div class="info-box blue">

<div class="calculator-box">

<div class="calc-heading">
<span class="calc-icon">▦</span>
<span>거래당사자 예상 비용 확인</span>
</div>


<div class="calc-tabs">

<button
class="calc-tab active"
data-type="sale"
type="button"
>
매매
</button>

<button
class="calc-tab"
data-type="jeonse"
type="button"
>
전세
</button>

<button
class="calc-tab"
data-type="monthly"
type="button"
>

</button>

<div
class="calc-inputs"
id="calcInputs"
></div>


<div class="calc-btn-wrap">

<button
class="calc-btn"
id="calcBtn"
type="button"
>

</button>

</div>


<div
class="calc-result"
id="calcResult"
>

<div class="result-empty">
거래금액을 입력한 후 비용 확인하기를 눌러주세요.
</div>

</div>

</div>



<div class="bottom-notice">

<div class="warning-icon">
!
</div>

<div class="bottom-notice-text">

✓ 표시된 금액은 부가세가 포함된 예상 금액입니다.<br>

✓ 매수인·임차인의 공인중개사 중개보수는 0원입니다.<br>

✓ 매도인·임대인의 플랫폼 이용료는 0원입니다.

</div>

</div>

</div>
`;


const topic =
new URLSearchParams(
  location.search
).get("topic") || "broker";


document
.getElementById("content")
.innerHTML =
topic === "fee"
  ? feePage
  : (pages[topic] || pages.broker);



if(topic === "fee"){

  let type = "sale";

  const inputs =
  document.getElementById(
    "calcInputs"
  );

  const result =
  document.getElementById(
    "calcResult"
  );


  function formatInputNumber(input){

    const raw =
    input.value.replace(
      /[^0-9]/g,
      ""
    );

    if(!raw){

      input.value = "";
      return;

    }

    input.value =
    Number(raw).toLocaleString();

  }


  function numberValue(id){

    const el =
    document.getElementById(id);

    if(!el){
      return 0;
    }

    return Number(
      String(el.value || "")
      .replace(/,/g,"")
      .replace(/[^0-9]/g,"")
    );

  }


  function bindMoneyInputs(){

    document
    .querySelectorAll(
      ".money-input"
    )
    .forEach(input => {

      input.addEventListener(
        "input",
        function(){

          formatInputNumber(this);

        }
      );

    });

  }


  function renderInputs(){

    document
    .querySelectorAll(
      ".calc-tab"
    )
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.type === type
      );

    });


    if(type === "sale"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group full">

          <label class="field-label">
          거래금액(매매가)
          </label>

          <div class="input-money-wrap">

            <input
            id="price"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="매매가격을 입력하세요"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    if(type === "jeonse"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group full">

          <label class="field-label">
          전세보증금
          </label>

          <div class="input-money-wrap">

            <input
            id="price"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="전세보증금을 입력하세요"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    if(type === "monthly"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group">

          <label class="field-label">
          보증금
          </label>

          <div class="input-money-wrap">

            <input
            id="deposit"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="보증금 입력"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>


        <div class="field-group">

          <label class="field-label">
          월세
          </label>

          <div class="input-money-wrap">

            <input
            id="monthlyRent"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="월세 입력"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    result.innerHTML = `

    <div class="result-empty">
    거래금액을 입력한 후 비용 확인하기를 눌러주세요.
    </div>

    `;


    bindMoneyInputs();

  }
    document
  .querySelectorAll(
    ".calc-tab"
  )
  .forEach(btn => {

    btn.addEventListener(
      "click",
      function(){

        type =
        this.dataset.type;

        renderInputs();

      }
    );

  });



  /*
    내부 계산용 중개보수 기준

    화면에는 요율이나 계산식을
    표시하지 않습니다.
  */

  function brokerageBase(
    value,
    isSale
  ){

    let rate = 0;
    let cap = null;


    if(isSale){

      if(value <= 50000000){

        rate = 0.006;
        cap = 250000;

      }else if(
        value <= 200000000
      ){

        rate = 0.005;
        cap = 800000;

      }else if(
        value <= 900000000
      ){

        rate = 0.004;

      }else if(
        value <= 1200000000
      ){

        rate = 0.005;

      }else if(
        value <= 1500000000
      ){

        rate = 0.006;

      }else{

        rate = 0.007;

      }

    }else{

      if(value <= 50000000){

        rate = 0.005;
        cap = 200000;

      }else if(
        value <= 100000000
      ){

        rate = 0.004;
        cap = 300000;

      }else if(
        value <= 600000000
      ){

        rate = 0.003;

      }else if(
        value <= 1200000000
      ){

        rate = 0.004;

      }else if(
        value <= 1500000000
      ){

        rate = 0.005;

      }else{

        rate = 0.006;

      }

    }


    let fee =
    value * rate;


    if(cap !== null){

      fee =
      Math.min(
        fee,
        cap
      );

    }


    return fee;

  }



  function money(value){

    return Math.round(
      value
    ).toLocaleString() + "원";

  }



  document
  .getElementById(
    "calcBtn"
  )
  .addEventListener(
    "click",
    function(){

      let transactionValue = 0;


      if(type === "monthly"){

        const deposit =
        numberValue(
          "deposit"
        );

        const monthly =
        numberValue(
          "monthlyRent"
        );


        if(
          deposit <= 0 &&
          monthly <= 0
        ){

          result.innerHTML = `

          <div class="result-empty">
          보증금 또는 월세 금액을 입력해 주세요.
          </div>

          `;

          return;

        }


        const first =
        deposit +
        (
          monthly * 100
        );


        transactionValue =
        first < 50000000
          ? deposit +
            (
              monthly * 70
            )
          : first;

      }else{

        transactionValue =
        numberValue(
          "price"
        );


        if(
          transactionValue <= 0
        ){

          result.innerHTML = `

          <div class="result-empty">
          거래금액을 입력해 주세요.
          </div>

          `;

          return;

        }

      }



      const baseFee =
      brokerageBase(
        transactionValue,
        type === "sale"
      );


      /*
        부가세 10% 포함
      */

      const sellerBrokerage =
      baseFee * 1.1;


      /*
        매수인·임차인 플랫폼 이용료

        기준 중개보수의 50%
        + 해당 금액의 부가세
      */

      const buyerPlatformFee =
      (
        baseFee * 0.5
      ) * 1.1;
            const buyerBrokerage =
      0;


      const sellerPlatformFee =
      0;


      const buyerTotal =
      buyerBrokerage +
      buyerPlatformFee;


      const sellerTotal =
      sellerBrokerage +
      sellerPlatformFee;



      const buyerName =
      type === "sale"
        ? "매수인"
        : "임차인";


      const sellerName =
      type === "sale"
        ? "매도인"
        : "임대인";



      result.innerHTML = `

      <div class="result-grid">


        <div class="result-card buyer">

          <div class="result-head">
          ${buyerName}
          </div>

          <div class="result-sub">
          공인중개사 중개보수 0원
          </div>


          <div class="result-body">

            <div class="result-line">

              <div class="result-label">
              공인중개사 중개보수
              </div>

              <div class="result-value">
              0원
              </div>

            </div>


            <div class="result-line">

              <div class="result-label">
              플랫폼 이용료
              </div>

              <div class="result-value main-value">
              ${money(buyerPlatformFee)}
              </div>

            </div>

          </div>


          <div class="result-total">

            <span>
            예상 총 비용
            </span>

            <strong>
            ${money(buyerTotal)}
            </strong>

          </div>

        </div>



        <div class="result-card seller">

          <div class="result-head">
          ${sellerName}
          </div>

          <div class="result-sub">
          플랫폼 이용료 0원
          </div>


          <div class="result-body">

            <div class="result-line">

              <div class="result-label">
              공인중개사 중개보수
              </div>

              <div class="result-value main-value">
              ${money(sellerBrokerage)}
              </div>

            </div>


            <div class="result-line">

              <div class="result-label">
              플랫폼 이용료
              </div>

              <div class="result-value">
              0원
              </div>

            </div>

          </div>


          <div class="result-total">

            <span>
            예상 총 비용
            </span>

            <strong>
            ${money(sellerTotal)}
            </strong>

          </div>

        </div>


      </div>

      `;

    }

  );


  renderInputs();

}

</script>

</body>
</html>

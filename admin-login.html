<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">
<title>본사 관리자 로그인 | 우리아파트 안심거래</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:clamp(18px,4vw,28px) clamp(12px,3vw,18px) 50px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  font-size:clamp(16px,4vw,21px);
  font-weight:900;
  color:#173a59;
  white-space:nowrap;
}

.brand strong{
  color:#1165d7;
}

.home{
  padding:8px 11px;
  border:1px solid #d4dfe7;
  border-radius:10px;
  background:#fff;
  color:#476377;
  font-size:clamp(11px,2.8vw,14px);
  font-weight:800;
  white-space:nowrap;
}

.card{
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:18px;
  padding:clamp(20px,4vw,28px) clamp(16px,3.5vw,24px);
  box-shadow:0 6px 18px rgba(26,61,88,.06);
}

.badge{
  display:inline-block;
  padding:6px 10px;
  margin-bottom:10px;
  border-radius:999px;
  background:#eaf4ff;
  color:#1165d7;
  font-size:clamp(10px,2.6vw,13px);
  font-weight:900;
}

h1{
  margin:0 0 8px;
  font-size:clamp(24px,5.5vw,30px);
  color:#143b61;
}

.lead{
  margin:0 0 18px;
  color:#697e8e;
  font-size:clamp(12px,3vw,15px);
  line-height:1.6;
  word-break:keep-all;
}

/* 임시 로그인 정보 표시 */
.login-info{
  margin:0 0 20px;
  padding:14px 15px;
  border:1px solid #b9d7ff;
  border-radius:12px;
  background:#f1f7ff;
}

.login-info-title{
  margin-bottom:9px;
  color:#1165d7;
  font-size:13px;
  font-weight:900;
}

.login-info-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:5px;
  color:#294b67;
  font-size:14px;
  line-height:1.5;
}

.login-info-label{
  min-width:70px;
  font-weight:800;
}

.login-info-value{
  font-weight:900;
  color:#102f4b;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:clamp(12px,3vw,14px);
  font-weight:900;
  color:#284b66;
}

input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid #cfdbe4;
  border-radius:11px;
  background:#fff;
  color:#172b3d;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.08);
}

button{
  width:100%;
  height:50px;
  margin-top:5px;
  border:0;
  border-radius:11px;
  background:#1165d7;
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

button:hover{
  background:#0d56b8;
}

.msg{
  min-height:22px;
  margin-top:12px;
  font-size:13px;
  line-height:1.5;
  text-align:center;
  font-weight:800;
}

.msg.error{
  color:#c62828;
}

.msg.ok{
  color:#147a52;
}

.notice{
  margin-top:18px;
  padding:13px 14px;
  border-radius:12px;
  background:#f7f9fb;
  color:#6c7f8e;
  font-size:12px;
  line-height:1.6;
  word-break:keep-all;
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#83939e;
  font-size:12px;
}

@media(max-width:480px){
  .login-info-row{
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <a class="brand" href="/">
    🏠 우리아파트 <strong>안심거래</strong>
  </a>

  <a class="home" href="/">
    메인으로
  </a>

</header>


<main class="card">

  <span class="badge">
    본사 관리자 전용
  </span>

  <h1>
    본사 관리자 로그인
  </h1>

  <p class="lead">
    본사 관리자 계정으로 로그인한 뒤 전체 운영현황을 관리합니다.
  </p>


  <!-- 임시 관리자 로그인 정보 표시 -->
  <div class="login-info">

    <div class="login-info-title">
      임시 관리자 로그인 정보
    </div>

    <div class="login-info-row">
      <span class="login-info-label">아이디</span>
      <span class="login-info-value">admin</span>
    </div>

    <div class="login-info-row">
      <span class="login-info-label">비밀번호</span>
      <span class="login-info-value">1234</span>
    </div>

  </div>


  <form id="adminLoginForm" novalidate>

    <div class="form-group">

      <label for="adminId">
        관리자 아이디
      </label>

      <input
        id="adminId"
        name="adminId"
        type="text"
        autocomplete="username"
        placeholder="관리자 아이디 입력">

    </div>


    <div class="form-group">

      <label for="adminPassword">
        비밀번호
      </label>

      <input
        id="adminPassword"
        name="adminPassword"
        type="password"
        autocomplete="current-password"
        placeholder="비밀번호 입력">

    </div>


    <button type="submit">
      관리자 로그인
    </button>


    <div
      id="msg"
      class="msg"
      aria-live="polite">
    </div>

  </form>


  <div class="notice">
    본사 관리자 전용 화면입니다.
    관리자 로그인 후 본사 관리자 화면으로 이동합니다.
  </div>

</main>


<div class="footer">
  © 우리아파트 안심거래
</div>

</div>


<script>
(function(){

"use strict";


/* =========================================
   임시 본사 관리자 로그인 정보
========================================= */

const ADMIN_ID = "admin";
const ADMIN_PASSWORD = "1234";


/* =========================================
   요소
========================================= */

const form =
  document.getElementById("adminLoginForm");

const adminId =
  document.getElementById("adminId");

const adminPassword =
  document.getElementById("adminPassword");

const msg =
  document.getElementById("msg");


/* =========================================
   로그인
========================================= */

form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    msg.className = "msg";
    msg.textContent = "";


    const id =
      adminId.value.trim();

    const password =
      adminPassword.value;


    /* 아이디 확인 */

    if(!id){

      msg.textContent =
        "관리자 아이디를 입력해 주세요.";

      msg.classList.add("error");

      adminId.focus();

      return;

    }


    /* 비밀번호 확인 */

    if(!password){

      msg.textContent =
        "비밀번호를 입력해 주세요.";

      msg.classList.add("error");

      adminPassword.focus();

      return;

    }


    /* 로그인 정보 확인 */

    if(
      id !== ADMIN_ID ||
      password !== ADMIN_PASSWORD
    ){

      msg.textContent =
        "아이디 또는 비밀번호가 올바르지 않습니다.";

      msg.classList.add("error");

      return;

    }


    /* 로그인 성공 */

    msg.textContent =
      "로그인되었습니다.";

    msg.classList.add("ok");


    setTimeout(
      function(){

        location.href =
          "/admin-dashboard.html";

      },
      300
    );

  }
);

})();
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1165d7">
<title>발급 확인 | 우리 아파트 분양</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  background:#f5f7fa;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  overflow-x:hidden;
}
.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:clamp(14px,4vw,28px) clamp(10px,3vw,14px) 50px;
}
.card{
  width:100%;
  background:#fff;
  border:1px solid #e5e9ef;
  border-radius:16px;
  padding:clamp(18px,4vw,24px);
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}
.head{
  margin-bottom:18px;
}
.head .badge{
  display:inline-block;
  margin-bottom:8px;
  padding:6px 10px;
  border-radius:999px;
  background:#eaf2ff;
  color:#1165d7;
  font-size:12px;
  font-weight:800;
}
h1{
  margin:0 0 7px;
  font-size:clamp(22px,5vw,28px);
}
.desc{
  margin:0;
  color:#667789;
  font-size:14px;
  line-height:1.6;
  word-break:keep-all;
}
.coupon{
  overflow:hidden;
  border:2px solid #1165d7;
  border-radius:16px;
  background:#fff;
}
.coupon-top{
  padding:20px;
  background:#1165d7;
  color:#fff;
  text-align:center;
}
.coupon-top small{
  display:block;
  margin-bottom:5px;
  opacity:.86;
}
.coupon-top strong{
  display:block;
  font-size:clamp(22px,6vw,30px);
  letter-spacing:.5px;
  overflow-wrap:anywhere;
}
.barcode-area{
  padding:18px 12px 14px;
  background:#fff;
  text-align:center;
}
.barcode-area svg{
  width:100%;
  max-width:430px;
  height:auto;
}
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:#e5e9ef;
}
.info div{
  min-width:0;
  padding:14px;
  background:#fff;
}
.info span{
  display:block;
  margin-bottom:5px;
  color:#71808d;
  font-size:12px;
}
.info strong{
  display:block;
  font-size:14px;
  overflow-wrap:anywhere;
}
.status{
  color:#17804b;
}
.empty{
  display:none;
  padding:32px 15px;
  border:1px dashed #c9d2da;
  border-radius:12px;
  color:#748391;
  text-align:center;
  line-height:1.7;
}
.actions{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  margin-top:16px;
}
button,a.btn{
  min-height:46px;
  border:0;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1165d7;
  color:#fff;
  font:inherit;
  font-size:14px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}
button.secondary,a.btn.secondary{
  background:#e9eef4;
  color:#314555;
}
@media(max-width:520px){
  .info{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <div class="head">
      <span class="badge" id="couponTopBadge">발급 완료</span>
      <h1 id="couponMainTitle">발급 확인</h1>
      <p class="desc" id="couponMainDesc">8페이지 전체 확인과 유효조회 60초를 완료한 고객에게 자동 발급됩니다.</p>
    </div>

    <div id="couponBox" class="coupon">
      <div class="coupon-top">
        <small id="couponNoLabel">발급번호</small>
        <strong id="couponNo">-</strong>
      </div>

      <div class="barcode-area">
        <svg id="barcode"></svg>
      </div>

      <div class="info">
        <div>
          <span>발급일시</span>
          <strong id="issuedAt">-</strong>
        </div>
        <div>
          <span>유효기간</span>
          <strong id="expiresAt">-</strong>
        </div>
        <div>
          <span>사용상태</span>
          <strong id="status" class="status">-</strong>
        </div>
        <div>
          <span id="pointLabel">지급 금액</span>
          <strong id="point">-</strong>
        </div>
      </div>
    </div>

    <div id="empty" class="empty">
      아직 발급된 내역이 없습니다.<br>
      분양 카탈로그 8페이지를 모두 확인하고 유효조회 60초를 끝까지 완료해 주세요.
    </div>

    <div class="actions">
      <a id="returnPresaleBtn" class="btn secondary" href="/index.html">분양목록으로</a>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

var couponBox = document.getElementById("couponBox");
var empty = document.getElementById("empty");

var params = new URLSearchParams(window.location.search);
var urlRoom = (params.get("room") || "").trim().toUpperCase();
var urlMode = params.get("mode") || "";
var urlCode = params.get("code");
var urlIssued = params.get("issued");
var urlExpires = params.get("expires");
var urlPoint = params.get("point");

var data = null;

if (urlCode) {
  data = {
    roomCode: urlRoom || "ROOM-001",
    channelType: urlMode || "daangn",
    couponNo: urlCode,
    issuedAt: urlIssued || "-",
    expiresAt: urlExpires || "-",
    status: "사용 가능",
    point: Number(urlPoint || 0)
  };
} else {
  try {
    data = JSON.parse(localStorage.getItem("presaleIssuedCoupon") || "null");
  } catch (e) {}
}

function renderCoupon(item) {
  if (!item || !item.couponNo) {
    couponBox.style.display = "none";
    empty.style.display = "block";
    return;
  }

  couponBox.style.display = "block";
  empty.style.display = "none";

  var isMart = item.channelType === "mart";
  var rewardTypeLabel = isMart ? "전자쿠폰" : "모바일 바코드카드";
  var amountFormatted = Number(item.point || 3000).toLocaleString("ko-KR") + "원";

  document.getElementById("couponTopBadge").textContent = rewardTypeLabel;
  document.getElementById("couponMainTitle").textContent = "발급된 " + rewardTypeLabel + " (" + amountFormatted + ")";
  document.getElementById("couponMainDesc").textContent =
    "8페이지 전체 확인과 유효조회 60초를 완료하여 " + amountFormatted + " " + rewardTypeLabel + "이(가) 발급되었습니다.";
  document.getElementById("couponNoLabel").textContent = rewardTypeLabel + " 번호";
  document.getElementById("couponNo").textContent = item.couponNo || "-";
  document.getElementById("issuedAt").textContent = item.issuedAt || "-";
  document.getElementById("expiresAt").textContent = item.expiresAt || "-";
  document.getElementById("status").textContent = item.status || "사용 가능";
  document.getElementById("pointLabel").textContent = isMart ? "쿠폰 금액" : "카드 금액";
  document.getElementById("point").textContent = amountFormatted;

  if (item.roomCode) {
    document.getElementById("returnPresaleBtn").href = "/index.html?room=" + encodeURIComponent(item.roomCode);
  }

  if (window.JsBarcode) {
    JsBarcode("#barcode", item.couponNo, {
      format: "CODE128",
      displayValue: true,
      fontSize: 15,
      height: 72,
      margin: 8
    });
  }
}

renderCoupon(data);

/* 본사관리자에서 수정한 최신 금액 및 채널(전자쿠폰 vs 모바일 바코드카드) 실시간 연동 */
var targetRoomCode = (data && data.roomCode) || urlRoom || "ROOM-001";
(async function syncFromHQ() {
  try {
    var apiOrigin = window.location.hostname.includes("wooriaptcd.com") ? "" : "https://wooriaptcd.com";
    var res = await fetch(apiOrigin + "/api/sale-save?code=" + encodeURIComponent(targetRoomCode));
    var json = await res.json();
    if (res.ok && json.ok && json.room && data) {
      var c = json.room.catalog_data || {};
      if (c.rewardAmount) data.point = Number(c.rewardAmount);
      if (c.channelType) data.channelType = c.channelType;
      renderCoupon(data);
    }
  } catch (e) {}
})();

})();
</script>

</body>
</html>
